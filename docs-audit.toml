# Machine-checkable links between implementation authorities and documentation.
# Keep each rule narrow. A broad rule creates noise and teaches people to ignore it.

[[contract]]
name = "module health"
source = "module-health.toml"
document = "docs/spec/reference/module-health.md"
source_terms = ["ploc_review", "cyclomatic_new"]
document_terms = ["rust-code-analysis-cli", "module-health-baseline.json"]

[[contract]]
name = "dependency admission"
source = "deny.toml"
document = "docs/spec/reference/dependency-security.md"
source_terms = ["[advisories]", "[licenses]"]
document_terms = ["cargo-deny", "cargo vet"]

[[contract]]
name = "document authority"
source = "crates/cli/src/docs_meta_cmd.rs"
document = "docs/spec/reference/doc-authority.md"
source_terms = ["canonical_for", "check_generated_index"]
document_terms = ["canonical_for", "generated index"]

[[contract]]
name = "local readiness"
source = "function-complexity.toml"
document = "docs/spec/reference/local-readiness.md"
source_terms = ["new_function_ceiling"]
document_terms = ["just ready", "function-complexity-baseline.json"]

[[impact]]
name = "documentation policy"
sources = ["crates/cli/src/docs_meta_cmd.rs", "crates/cli/src/docs_audit_cmd.rs", "docs-audit.toml"]
documents = ["docs/spec/reference/doc-authority.md"]

[[impact]]
name = "configuration contract"
sources = ["crates/config/", "crates/config-loader/", "config/"]
documents = ["docs/spec/config-spec.md", "docs/spec/reference/tuning.md"]

[[impact]]
name = "dependency security policy"
sources = ["deny.toml", "supply-chain/", "crates/cli/src/dependency_security_cmd.rs"]
documents = ["docs/spec/reference/dependency-security.md"]

[[impact]]
name = "module health policy"
sources = ["module-health.toml", "crates/cli/src/module_health_cmd.rs", "crates/cli/src/module_health_cmd/"]
documents = ["docs/spec/reference/module-health.md"]

[[impact]]
name = "local readiness policy"
sources = ["function-complexity.toml", "crates/cli/src/function_complexity_cmd.rs", "crates/cli/src/readiness_cmd.rs", ".githooks/", "justfile"]
documents = ["docs/spec/reference/local-readiness.md"]

# Narrow, persistent exceptions are allowed only for a source path and must carry
# review evidence. Add these only after a human confirms that no prose changed.
