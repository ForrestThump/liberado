# Cognitive-complexity ceiling enforced by the CI clippy gate
# (`-D clippy::cognitive_complexity`). The threshold is the clippy default;
# the point of the file is to pin it explicitly and make the gate's ceiling
# discoverable in one place. Lowering it is a follow-up once the 2026-05
# baseline of allowlisted functions is refactored away.
cognitive-complexity-threshold = 25
