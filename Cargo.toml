# Liberado — Rust-native personal AI system.
#
# One Cargo workspace for the Liberado system (Decision 7). The ForrestThump
# forks live under `third_party/` (excluded) and are path dependencies. They
# are not workspace members.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [
    "liberado-tool-helper-mcp", # superseded by crates/memory-store + crates/memory-mcp (Decision 7)
    "mcps",
    "third_party",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
authors = ["Shiloh Mangus"]
repository = "https://github.com/shilohmangus/liberado"

[workspace.dependencies]
# --- shared third-party ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = "0.13"
# serde_norway is the maintained hard fork of serde_yaml 0.9. serde_yaml is
# deprecated and pulls in unmaintained unsafe-libyaml (RUSTSEC-2024-0449).
# serde_yml is unsound and unmaintained (RUSTSEC-2025-0068).
serde_norway = "0.9"
# Exact pin. 0.2.35 is already in the graph through gix-date and is cargo-vet
# exempt. A caret range can resolve an unaudited patch. `serde` is the RFC 3339
# timestamp shape the workspace serializes.
jiff = { version = "=0.2.35", features = ["serde"] }
# Maintained cron parser on jiff. Replaces the unmaintained `cron` 0.12 crate
# (7-field, seconds first). Exact pin so a later patch needs a vet review.
jiff-cron = "=0.3.0"
thiserror = "2"
toml = "0.8"
# Exact pin: this is the toml_edit already pulled by toml 0.8, and the
# cargo-vet exemption is for 0.22.27. A caret range can resolve an unaudited patch.
toml_edit = "=0.22.27"
cargo_metadata = "0.23"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tempfile = "3"
flate2 = "1"
# Workspace pin is 0.12 without `blocking`. Crates that need blocking (cli shepherd,
# server pr-review publish, ops) enable `features = ["blocking"]` locally. turbomcp
# still brings reqwest 0.13 into the graph — majors are not unified until that pin moves.
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
base64 = "0.22"
# Exact pin. aws-lc-rs 1.18.1 is already in the graph (rustls) and already
# cargo-vet exempt. A caret range could pull an unaudited patch.
# default-features stays off so ring-io does not pull untrusted 0.7.
# prebuilt-nasm is the crate's fallback when the Windows assembler is absent.
# A machine that has NASM still compiles the assembly itself.
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["alloc", "aws-lc-sys", "prebuilt-nasm"] }
# Exact pin. 0.41.1 pulls libsqlite3-sys 0.39.1, whose bundled SQLite is 3.54.1.
# That is the patched range for RUSTSEC-2026-0459 (libsqlite3-sys >= 0.39.0).
# `bundled` keeps the homelab image off a system libsqlite.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
ulid = { version = "1", features = ["serde"] }
ratatui = "0.29"
crossterm = "0.28"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
regex = "1"
notify = "8"
proptest = "1"
gix = { version = "0.86", default-features = false, features = ["max-performance-safe", "blocking-network-client", "blob-diff", "worktree-mutation", "sha1", "excludes", "worktree-stream", "status"] }
glob = "0.3"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"

# --- internal crates ---
liberado-bootstrap = { path = "crates/bootstrap" }
liberado-common = { path = "crates/common" }
liberado-agent-workspace = { path = "crates/agent-workspace" }
liberado-config = { path = "crates/config" }
liberado-config-loader = { path = "crates/config-loader" }
liberado-conversation-store = { path = "crates/conversation-store" }
liberado-provider = { path = "crates/provider" }
liberado-provider-openai-compat = { path = "crates/provider-openai-compat" }
liberado-vault = { path = "crates/vault" }
liberado-dispatcher = { path = "crates/dispatcher" }
liberado-executor = { path = "crates/executor" }
liberado-scratchpad = { path = "crates/scratchpad" }
liberado-notify = { path = "crates/notify" }
liberado-outbox = { path = "crates/outbox" }
liberado-messaging = { path = "crates/messaging" }
liberado-mcp = { path = "crates/mcp" }
liberado-orchestrator = { path = "crates/orchestrator" }
liberado-policy = { path = "crates/policy" }
liberado-main-agent = { path = "crates/main-agent" }
liberado-daemon = { path = "crates/daemon" }
liberado-server = { path = "crates/server" }
liberado-theme = { path = "crates/theme" }
chat-client-contract = { path = "crates/chat-client-contract" }
liberado-markdown = { path = "crates/markdown" }
liberado-matrix = { path = "crates/matrix" }
liberado-commands = { path = "crates/liberado-commands" }
liberado-test-support = { path = "crates/test-support" }
liberado-tool-runtime = { path = "crates/tool-runtime" }
liberado-eval = { path = "crates/eval" }
liberado-cost = { path = "crates/cost" }
liberado-ops = { path = "crates/ops" }
liberado-telegram-approvals = { path = "crates/telegram-approvals" }
liberado-cron = { path = "crates/cron" }
liberado-chat-search = { path = "crates/chat-search" }
liberado-memory-store = { path = "crates/memory-store" }
liberado-coder-agent = { path = "crates/coder-agent" }
liberado-coder-core = { path = "crates/coder-core" }
liberado-coder-sandbox = { path = "crates/coder-sandbox" }
liberado-coder-tools = { path = "crates/coder-tools", default-features = false }
liberado-session = { path = "crates/session" }
liberado-session-store = { path = "crates/session-store" }
liberado-dispatch-pack = { path = "crates/dispatch-pack" }
liberado-harness-eval = { path = "crates/harness-eval" }
liberado-sysmap = { path = "crates/sysmap" }
liberado-sysmap-gui = { path = "crates/sysmap-gui" }
sysmap-core = { path = "crates/sysmap-core" }

# Forks live in `third_party/` so the workspace can drop `chrono`. They are the
# tagged checkouts (`turbovault` `liberado-2026-11-10`, `turbomcp`
# `liberado-2026-08-27`) with time types moved to `jiff`. Path deps replace the
# git pins until those forks publish the same change.
turbovault-core = { path = "third_party/turbovault/crates/turbovault-core" }
turbovault-vault = { path = "third_party/turbovault/crates/turbovault-vault" }
turbovault-audit = { path = "third_party/turbovault/crates/turbovault-audit" }
turbovault = { path = "third_party/turbovault/crates/turbovault" } # umbrella (ObsidianMcpServer) — test-only
# liberado-memory-store's semantic recall.
turbovault-vector = { path = "third_party/turbovault/crates/turbovault-vector" }
# Obsidian Tasks lines and the Tasks plugin global filter. Used by task-ping.
turbovault-parser = { path = "third_party/turbovault/crates/turbovault-parser" }
turbovault-plugin-tasks = { path = "third_party/turbovault/crates/plugins/turbovault-plugin-tasks" }
turbomcp = { path = "third_party/turbomcp/crates/turbomcp" }
turbomcp-client = { path = "third_party/turbomcp/crates/turbomcp-client" }
turbomcp-transport = { path = "third_party/turbomcp/crates/turbomcp-transport" } # ChildProcessTransport (stdio connector)
turbomcp-server = { path = "third_party/turbomcp/crates/turbomcp-server" } # test-only (in-process channel server)
turbomcp-core = { path = "third_party/turbomcp/crates/turbomcp-core" }     # test-only (McpHandler)
turbomcp-types = { path = "third_party/turbomcp/crates/turbomcp-types" }   # test-only (handler types)

# turbovault still names `turbomcp*` as crates.io 3.1.5. Redirect those names at
# the same path copies. Every crate turbovault names must be listed, or Cargo
# links two copies and identical-looking types stop unifying.
[patch.crates-io]
turbomcp = { path = "third_party/turbomcp/crates/turbomcp" }
turbomcp-core = { path = "third_party/turbomcp/crates/turbomcp-core" }
turbomcp-server = { path = "third_party/turbomcp/crates/turbomcp-server" }
turbomcp-types = { path = "third_party/turbomcp/crates/turbomcp-types" }

[profile.release]
lto = true
codegen-units = 1


# The wasm bundle's profile. dx (Dioxus CLI) builds `--profile wasm-release` and injects a
# definition for it when the manifest has none; declaring it here is the only way to add a key dx
# does not set, and the reason we need one is `strip`.
#
# Without it the release wasm carried ~271 KB of DWARF — 15% of what browsers download, and
# unreadable there. Worse, binaryen chokes on it: dx's `wasm-opt` step died with 0xC0000409
# (STATUS_STACK_BUFFER_OVERRUN) on *read*, before running a single pass, and dx logs that as ERROR
# and then reports "Client build completed successfully" with exit 0 — so the unoptimized bundle
# shipped and nothing said so. Verified by bisection: wasm-opt crashes on this module at every
# optimization level including none, and succeeds once the `.debug_*` sections are removed.
#
# Every key below must match what dx would otherwise inject, because declaring the profile
# suppresses its definition entirely. `opt-level = "s"` in particular is NOT release's default of 3
# — inheriting release without restating it grew the code section by 250 KB, a size regression
# hidden underneath the DWARF the same change removed. Check against dx with:
#   python -c "import json,glob; print(json.load(open(glob.glob('target/dx/.captured-args/*/liberado_webui.bin.json')[0]))['args'])"
[profile.wasm-release]
inherits = "release"
opt-level = "s"   # dx's value; release's 3 costs ~250 KB here
strip = "debuginfo"
# vim: set ts=4 sw=4 sts=4 et:
