# Liberado — Rust-native personal AI Life OS.
#
# One Cargo workspace for the Liberado system (Decision 7). External dependencies
# (turbovault, turbomcp) are NOT members — they are consumed as git+tag pins on the
# ForrestThump forks. Leftover `turbovault/` and `turbomcp/` directories are gitignored
# and are not required to build.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [
    "liberado-tool-helper-mcp", # superseded by crates/memory-store + crates/memory-mcp (Decision 7)
    "mcps",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
authors = ["Shiloh Mangus"]
repository = "https://github.com/shilohmangus/liberado"

[workspace.dependencies]
# --- shared third-party ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = "0.13"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "2"
toml = "0.8"
cargo_metadata = "0.23"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tempfile = "3"
flate2 = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
ulid = { version = "1", features = ["serde"] }
ratatui = "0.29"
crossterm = "0.28"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
cron = "0.12"
regex = "1"
notify = "8"
proptest = "1"
gix = { version = "0.86", default-features = false, features = ["max-performance-safe", "blocking-network-client", "blob-diff", "worktree-mutation", "sha1", "excludes", "worktree-stream", "status"] }
glob = "0.3"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"

# --- internal crates ---
liberado-bootstrap = { path = "crates/bootstrap" }
liberado-common = { path = "crates/common" }
liberado-config = { path = "crates/config" }
liberado-config-loader = { path = "crates/config-loader" }
liberado-conversation-store = { path = "crates/conversation-store" }
liberado-provider = { path = "crates/provider" }
liberado-provider-openai-compat = { path = "crates/provider-openai-compat" }
liberado-vault = { path = "crates/vault" }
liberado-dispatcher = { path = "crates/dispatcher" }
liberado-executor = { path = "crates/executor" }
liberado-scratchpad = { path = "crates/scratchpad" }
liberado-notify = { path = "crates/notify" }
liberado-messaging = { path = "crates/messaging" }
liberado-mcp = { path = "crates/mcp" }
liberado-orchestrator = { path = "crates/orchestrator" }
liberado-main-agent = { path = "crates/main-agent" }
liberado-daemon = { path = "crates/daemon" }
liberado-server = { path = "crates/server" }
liberado-theme = { path = "crates/theme" }
chat-client-contract = { path = "crates/chat-client-contract" }
liberado-markdown = { path = "crates/markdown" }
liberado-commands = { path = "crates/liberado-commands" }
liberado-test-support = { path = "crates/test-support" }
liberado-eval = { path = "crates/eval" }
liberado-cost = { path = "crates/cost" }
liberado-ops = { path = "crates/ops" }
liberado-telegram-approvals = { path = "crates/telegram-approvals" }
liberado-cron = { path = "crates/cron" }
liberado-chat-search = { path = "crates/chat-search" }
liberado-memory-store = { path = "crates/memory-store" }
liberado-coder-agent = { path = "crates/coder-agent" }
liberado-coder-core = { path = "crates/coder-core" }
liberado-coder-sandbox = { path = "crates/coder-sandbox" }
liberado-coder-tools = { path = "crates/coder-tools" }
liberado-session = { path = "crates/session" }
liberado-session-store = { path = "crates/session-store" }
liberado-dispatch-pack = { path = "crates/dispatch-pack" }
liberado-harness-eval = { path = "crates/harness-eval" }
liberado-sysmap = { path = "crates/sysmap" }
liberado-sysmap-gui = { path = "crates/sysmap-gui" }
sysmap-core = { path = "crates/sysmap-core" }

# --- co-developed git+tag pins (Decision 7) ---
# ForrestThump forks at tag `liberado-2026-08-27`. Cargo fetches them; path siblings are
# not required. Swap to crates.io versions for release builds once the forks publish.
turbovault-core = { git = "https://github.com/ForrestThump/turbovault", tag = "liberado-2026-08-27" }
turbovault-vault = { git = "https://github.com/ForrestThump/turbovault", tag = "liberado-2026-08-27" }
turbovault-audit = { git = "https://github.com/ForrestThump/turbovault", tag = "liberado-2026-08-27" }
turbovault = { git = "https://github.com/ForrestThump/turbovault", tag = "liberado-2026-08-27" } # umbrella (ObsidianMcpServer) — test-only
# liberado-memory-store's semantic recall.
turbovault-vector = { git = "https://github.com/ForrestThump/turbovault", tag = "liberado-2026-08-27" }
turbomcp = { git = "https://github.com/ForrestThump/turbomcp", tag = "liberado-2026-08-27" }
turbomcp-client = { git = "https://github.com/ForrestThump/turbomcp", tag = "liberado-2026-08-27" }
turbomcp-transport = { git = "https://github.com/ForrestThump/turbomcp", tag = "liberado-2026-08-27" } # ChildProcessTransport (stdio connector)
turbomcp-server = { git = "https://github.com/ForrestThump/turbomcp", tag = "liberado-2026-08-27" } # test-only (in-process channel server)
turbomcp-core = { git = "https://github.com/ForrestThump/turbomcp", tag = "liberado-2026-08-27" }     # test-only (McpHandler)
turbomcp-types = { git = "https://github.com/ForrestThump/turbomcp", tag = "liberado-2026-08-27" }   # test-only (handler types)

# The git-pinned turbovault still declares the `turbomcp*` crates as "3.1.5" from crates.io.
# Redirect them to the same ForrestThump tag so the whole tree builds against ONE turbomcp — the one
# carrying the request `_meta` pass-through. Remove once turbomcp publishes the change.
#
# Every turbomcp-* crate turbovault names must be listed, not just the umbrella. Patching `turbomcp`
# alone linked the fork's `turbomcp-core` (via the umbrella) alongside the registry's (via
# turbovault's direct dep) — two crates of the same name in one graph, so identical-looking types
# stopped unifying: "expected `ResourceTemplate`, found `turbomcp_core::ResourceTemplate`". That is
# what kept the `e2e` provenance capstone unbuildable and switched off.
[patch.crates-io]
turbomcp = { git = "https://github.com/ForrestThump/turbomcp", tag = "liberado-2026-08-27" }
turbomcp-core = { git = "https://github.com/ForrestThump/turbomcp", tag = "liberado-2026-08-27" }
turbomcp-server = { git = "https://github.com/ForrestThump/turbomcp", tag = "liberado-2026-08-27" }
turbomcp-types = { git = "https://github.com/ForrestThump/turbomcp", tag = "liberado-2026-08-27" }

[profile.release]
lto = true
codegen-units = 1


# The wasm bundle's profile. dx (Dioxus CLI) builds `--profile wasm-release` and injects a
# definition for it when the manifest has none; declaring it here is the only way to add a key dx
# does not set, and the reason we need one is `strip`.
#
# Without it the release wasm carried ~271 KB of DWARF — 15% of what browsers download, and
# unreadable there. Worse, binaryen chokes on it: dx's `wasm-opt` step died with 0xC0000409
# (STATUS_STACK_BUFFER_OVERRUN) on *read*, before running a single pass, and dx logs that as ERROR
# and then reports "Client build completed successfully" with exit 0 — so the unoptimized bundle
# shipped and nothing said so. Verified by bisection: wasm-opt crashes on this module at every
# optimization level including none, and succeeds once the `.debug_*` sections are removed.
#
# Every key below must match what dx would otherwise inject, because declaring the profile
# suppresses its definition entirely. `opt-level = "s"` in particular is NOT release's default of 3
# — inheriting release without restating it grew the code section by 250 KB, a size regression
# hidden underneath the DWARF the same change removed. Check against dx with:
#   python -c "import json,glob; print(json.load(open(glob.glob('target/dx/.captured-args/*/liberado_webui.bin.json')[0]))['args'])"
[profile.wasm-release]
inherits = "release"
opt-level = "s"   # dx's value; release's 3 costs ~250 KB here
strip = "debuginfo"
# vim: set ts=4 sw=4 sts=4 et:
