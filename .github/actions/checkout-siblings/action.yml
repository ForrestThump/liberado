name: Checkout pinned sibling dependencies
description: Check out the exact turbovault and turbomcp commits required by Cargo
inputs:
  token:
    description: Read-only token for sibling repositories
    required: true
runs:
  using: composite
  steps:
    - name: Checkout turbovault
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ForrestThump/turbovault
        ref: bf9f0baf4a91d9e0718f2b8a3112ca0491bf145f
        path: turbovault
        token: ${{ inputs.token }}
        persist-credentials: false

    - name: Checkout turbomcp
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ForrestThump/turbomcp
        ref: d5d9a9f8321f07b9693e9869b8afebfecc049e71
        path: turbomcp
        token: ${{ inputs.token }}
        persist-credentials: false
