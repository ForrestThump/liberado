# Liberado CI — fmt, clippy, tests, and the layer-rules gate.
#
# Sibling repos: the workspace consumes `turbovault/` and `turbomcp/` as path dependencies
# (Decision 7 co-development), so CI checks them out into the same layout the dev machine uses.
# If the ForrestThump forks are private, add a classic PAT with `repo` scope as the
# `SIBLINGS_TOKEN` repository secret; for public forks the default token suffices.
#
# The layer-rules test (crates/test-support/tests/layer_rules.rs) runs as part of the normal
# test suite — a dependency-layering violation fails CI, not just an audit.
#
# Toolchain: pinned by `rust-toolchain.toml`, not named here. Tracking floating `stable` meant a
# Rust release could redden CI with no code change, and the resulting lint failures could not be
# reproduced on the dev machine at all. See that file for the details.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Path deps + lockfile: build exactly what's checked in.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout liberado
        uses: actions/checkout@v4

      - name: Checkout turbovault (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: ForrestThump/turbovault
          ref: develop
          path: turbovault
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      - name: Checkout turbomcp (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: ForrestThump/turbomcp
          ref: develop
          path: turbomcp
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      # No version here on purpose: `rust-toolchain.toml` is the single source of truth, and
      # rustup installs what it names (plus its components) on first use. Naming a toolchain in
      # both places is how CI and the dev machine drift apart again.
      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      # webui is excluded: it is a Dioxus WASM crate (shipped via `dx build --web`), and its
      # native cdylib build reports component scaffolding as dead code. Re-include once the
      # webui matures past pre-alpha or grows a wasm CI job of its own.
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --exclude liberado-webui --all-targets -- -D warnings

      - name: Tests (includes layer-rules gate)
        run: cargo test --workspace

  audit:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado
        uses: actions/checkout@v4

      # The siblings are checked out here for the same reason as in `test`, and it is easy to miss
      # why: cargo-deny resolves the *whole* dependency graph, so it needs the path deps present
      # even though it compiles nothing. Without these the job fails inside `cargo metadata`
      # ("failed to load source for dependency `turbomcp`") before reading a single advisory — a
      # red that looks like a dependency problem and is not one.
      - name: Checkout turbovault (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: ForrestThump/turbovault
          ref: develop
          path: turbovault
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      - name: Checkout turbomcp (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: ForrestThump/turbomcp
          ref: develop
          path: turbomcp
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      # Deliberately not EmbarkStudios/cargo-deny-action: it runs inside a `rust:1.85-alpine`
      # container, where `rust-toolchain.toml`'s 1.94.1 pin is an uninstalled override and rustup
      # refuses to proceed. Installing the binary on the runner keeps every job on the one pinned
      # toolchain, which is the whole point of that file.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Deny check
        run: cargo deny check

  doc-links:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Regex-based checker for relative markdown links in docs/. Skips http(s)
      # URLs and .secret files; fails the job on broken links.
      - name: Check docs links
        shell: pwsh
        run: ./scripts/check-doc-links.ps1
