name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI compiles untrusted dependencies. It never needs repository write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Resolve and inspect the graph without compiling it. Every job that can
  # execute a build script or proc macro waits for this job.
  dependency-security:
    name: dependency admission (locked + deny + vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned sibling dependencies
        uses: ./.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Install pinned security tools
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-deny@0.19.4,cargo-vet@0.10.0

      - name: Locked dependency graph
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Advisories, yanks, sources, licenses, and build scripts
        run: cargo deny --locked check

      - name: Audited dependency graph
        run: cargo vet --locked

  early-lint:
    name: early readiness lint (ubuntu-latest)
    needs: dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned sibling dependencies
        uses: ./.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install pinned complexity tool
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-crap@0.4.3

      - name: Format and workflow-security lint
        run: |
          cargo fmt --check
          cargo clippy --locked -p liberado-test-support --all-targets -- -D warnings -D clippy::cognitive_complexity
          cargo test --locked -p liberado-test-support --test workflow_security_rules

      - name: Host-stable function complexity
        # CRAP at 0% coverage is c²+c. The configured cyclomatic ceiling is 20,
        # so 420 is the equivalent cargo-crap ceiling for new functions.
        run: >-
          cargo crap --workspace --missing pessimistic --threshold 420
          --baseline function-complexity-baseline.json --fail-regression --fail-above
          --format human --sort file

  test:
    name: test (${{ matrix.os }})
    needs: [dependency-security, early-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned sibling dependencies
        uses: ./.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: PR shepherd self-test
        run: cargo run --locked -p liberado-cli -- shepherd --self-test

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude liberado-webui --all-targets -- -D warnings -D clippy::cognitive_complexity

      - name: Tests (includes architecture and workflow-security rules)
        run: cargo test --locked --workspace --no-fail-fast

  module-health:
    name: Module health regression (ubuntu-latest)
    needs: dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned sibling dependencies
        uses: ./.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install rust-code-analysis-cli
        run: cargo install rust-code-analysis-cli --version 0.0.25 --locked

      - name: Compare file metrics to the committed baseline
        run: cargo run --locked --quiet -p liberado-cli -- ci modules

      - name: Upload current module-health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-health-current-ubuntu
          path: .liberado/module-health-current.json
          if-no-files-found: warn

  crap:
    name: CRAP regression (ubuntu-latest)
    needs: [dependency-security, early-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned sibling dependencies
        uses: ./.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install cargo-llvm-cov and cargo-crap
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-llvm-cov,cargo-crap@0.4.3

      - name: Compare CRAP scores to the committed baseline
        run: cargo run --locked --quiet -p liberado-cli -- ci crap

      - name: Upload this host's CRAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crap-current-ubuntu
          path: .liberado/crap-current.json
          if-no-files-found: warn

      - name: Upload the quiet-CI full log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-log-ubuntu
          path: .liberado/ci.log
          if-no-files-found: warn

  doc-links:
    name: Docs link check (${{ matrix.os }})
    needs: dependency-security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout pinned sibling dependencies
        uses: ./.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check docs links
        run: cargo run --locked -p liberado-cli -- docs check-links

      - name: Documentation contracts and executable examples
        run: cargo run --locked -p liberado-cli -- docs audit

      - name: Documentation impact since PR base
        if: github.event_name == 'pull_request'
        run: cargo run --locked -p liberado-cli -- docs audit --base ${{ github.event.pull_request.base.sha }}

      - name: Document metadata self-test
        run: cargo run --locked -p liberado-cli -- docs metadata self-test

      - name: Document metadata and index lint
        run: cargo run --locked -p liberado-cli -- docs metadata lint

      - name: Crate map is current
        run: cargo run --locked -p liberado-cli -- docs crate-map

      - name: Obsolete docs paths in Rust sources
        run: cargo run --locked -p liberado-cli -- docs metadata check-stale-rs

      - name: Docs site generator smoke
        run: cargo run --locked -p liberado-cli -- docs site --out "${{ runner.temp }}/docs-site"

  rustdoc:
    name: cargo doc (broken intra-doc links denied)
    needs: dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned sibling dependencies
        uses: ./.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Workspace docs
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --locked --workspace --no-deps --document-private-items
