name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI compiles untrusted dependencies. It never needs repository write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Resolve and inspect the graph without compiling it. Every job that can
  # execute a build script or proc macro waits for this job.
  dependency-security:
    name: dependency admission (locked + deny + vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Install pinned security tools
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-deny@0.19.4,cargo-vet@0.10.0

      - name: Locked dependency graph
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Advisories, yanks, sources, licenses, and build scripts
        run: cargo deny --locked check

      - name: Audited dependency graph
        run: cargo vet --locked

  early-lint:
    name: early readiness lint (ubuntu-latest)
    needs: dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install pinned complexity tool
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-crap@0.4.3

      - name: Format and workflow-security lint
        run: |
          cargo fmt --check
          cargo clippy --locked -p liberado-test-support --all-targets -- -D warnings -D clippy::cognitive_complexity
          cargo test --locked -p liberado-test-support --test workflow_security_rules

      - name: Host-stable function complexity
        # Use the same policy implementation as `just ready`. The raw cargo-crap
        # defaults belong to the coverage-sensitive CRAP gate, not this gate.
        run: cargo run --locked -p liberado-cli -- ci complexity

  test:
    name: test (${{ matrix.os }})
    needs: [dependency-security, early-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: PR shepherd self-test
        run: cargo run --locked -p liberado-cli -- shepherd --self-test

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude liberado-webui --all-targets -- -D warnings -D clippy::cognitive_complexity

      - name: Tests (includes architecture and workflow-security rules)
        run: cargo test --locked --workspace --no-fail-fast

      - name: Standalone branch cleaner tests
        run: python -m unittest scripts/test_cleanup_merged_branches.py

  # The native workspace excludes this WASM-only surface. Build the same release
  # bundle the deploy image serves, so UI errors return in minutes rather than
  # after a complete Docker image build.
  webui:
    name: WebUI WASM release build
    needs: [dependency-security, early-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install the pinned Dioxus CLI
        env:
          DX_VERSION: 0.7.10
          DX_SHA256: 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/dx.tar.gz" "https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  ${RUNNER_TEMP}/dx.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/dioxus-cli/bin"
          tar -xzf "${RUNNER_TEMP}/dx.tar.gz" -C "${RUNNER_TEMP}/dioxus-cli/bin"
          chmod +x "${RUNNER_TEMP}/dioxus-cli/bin/dx"
          echo "${RUNNER_TEMP}/dioxus-cli/bin" >> "${GITHUB_PATH}"

      - name: Build the release bundle
        run: dx build -r -p liberado-webui --web

      - name: Verify the PWA release shell
        run: |
          set -euo pipefail
          bundle=target/dx/liberado-webui/release/web/public
          test -f "${bundle}/index.html"
          test -f "${bundle}/manifest.json"
          test -f "${bundle}/sw.js"
          python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "${bundle}/manifest.json"

  module-health:
    name: Module health regression (ubuntu-latest)
    needs: dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install rust-code-analysis-cli
        run: cargo install rust-code-analysis-cli --version 0.0.25 --locked

      - name: Compare file metrics to the committed baseline
        run: cargo run --locked --quiet -p liberado-cli -- ci modules

      - name: Upload current module-health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-health-current-ubuntu
          path: .liberado/module-health-current.json
          if-no-files-found: warn

  crap:
    name: CRAP regression (ubuntu-latest)
    needs: [dependency-security, early-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov and cargo-crap
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-llvm-cov,cargo-crap@0.4.3

      - name: Compare CRAP scores to the committed baseline
        run: cargo run --locked --quiet -p liberado-cli -- ci crap

      - name: Upload this host's CRAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crap-current-ubuntu
          path: .liberado/crap-current.json
          if-no-files-found: warn

      - name: Upload the quiet-CI full log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-log-ubuntu
          path: .liberado/ci.log
          if-no-files-found: warn

  doc-links:
    name: Docs link check (${{ matrix.os }})
    needs: dependency-security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check docs links
        run: cargo run --locked -p liberado-cli -- docs check-links

      - name: Documentation contracts and executable examples
        run: cargo run --locked -p liberado-cli -- docs audit

      - name: Documentation impact since PR base
        if: github.event_name == 'pull_request'
        run: cargo run --locked -p liberado-cli -- docs audit --base ${{ github.event.pull_request.base.sha }}

      - name: Document metadata self-test
        run: cargo run --locked -p liberado-cli -- docs metadata self-test

      - name: Document metadata and index lint
        run: cargo run --locked -p liberado-cli -- docs metadata lint

      - name: Crate map is current
        run: cargo run --locked -p liberado-cli -- docs crate-map

      - name: Obsolete docs paths in Rust sources
        run: cargo run --locked -p liberado-cli -- docs metadata check-stale-rs

      - name: Docs site generator smoke
        run: cargo run --locked -p liberado-cli -- docs site --out "${{ runner.temp }}/docs-site"

  rustdoc:
    name: cargo doc (broken intra-doc links denied)
    needs: dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Workspace docs
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --locked --workspace --no-deps --document-private-items

  # Real deploy-image build. Separate from the test matrix so a 30–90 minute Docker
  # compile does not sit inside fmt/clippy/test. Still waits on dependency admission
  # because the Dockerfile compiles the workspace (including build scripts).
  deploy-image:
    name: deploy image (GHCR)
    # Automatic on main; PR images need an explicit maintainer label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'deploy-image')
    needs: [dependency-security, early-lint, test, webui, module-health, crap, doc-links, rustdoc]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GHCR_IMAGE: ghcr.io/forrestthump/liberado
    steps:
      - name: Checkout liberado without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR merge commits are not what the operator checks out. Stamp and build the branch tip.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set image tags
        id: tags
        run: |
          set -euo pipefail
          tags="${GHCR_IMAGE}:sha-${COMMIT_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            tags="${tags}"$'\n'"${GHCR_IMAGE}:pr-${{ github.event.number }}"
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags}"$'\n'"${GHCR_IMAGE}:main"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          printf 'tags:\n%s\n' "${tags}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push deploy image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          # Attestations need id-token: write. This job only needs packages: write.
          provenance: false
          sbom: false
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_SHA=${{ env.COMMIT_SHA }}
            CARGO_BUILD_JOBS=1
            BAKE_WEBUI=1
          cache-from: type=registry,ref=ghcr.io/forrestthump/liberado:buildcache
          cache-to: ${{ (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request') && 'type=registry,ref=ghcr.io/forrestthump/liberado:buildcache,mode=max' || '' }}

      - name: Record pull command
        run: |
          {
            echo "## Deploy image"
            echo
            echo "Pull this commit:"
            echo
            echo "\`\`\`bash"
            echo "docker pull ${GHCR_IMAGE}:sha-${COMMIT_SHA}"
            echo "\`\`\`"
            echo
            echo "Homelab try-it path: check out this SHA, then \`deploy/homelab/setup.sh\`."
          } >> "${GITHUB_STEP_SUMMARY}"
