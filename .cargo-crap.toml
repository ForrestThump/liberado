# cargo-crap persistent configuration (searched upward from the CWD).
# CLI flags always take precedence over values here.
#
# Canonical home for quality-metric artifacts is `code-metrics/`.
# This filename must stay at the repo root: cargo-crap discovers only
# `.cargo-crap.toml` via upward search. Keep in sync with
# `code-metrics/cargo-crap.toml` (same body; documented twin).
#
# Liberado does not commit a per-function CRAP baseline. `liberado ci crap`
# owns pass/fail: a new function must land at or under `threshold` (29.9), and
# a function that already exists on the merge-base must not get worse than the
# score measured on that commit. The diff gate's CRAP epsilon is 0.001.
# `epsilon` below is cargo-crap's own compare epsilon for a manual run.
#
# `fail-above` stays off. A bare `cargo crap` must not fail a function the
# diff did not touch. Do not set `min`. Scores at or under the limit pass,
# so a 4→5 move is not a failure.
#
# `missing = skip`: a function llvm-cov did not instrument (typically a
# `#[cfg]` that is off on this OS) is omitted instead of scored at 0%.
#
# `sort = file` keeps a hand-run report stable.
threshold = 29.9
fail-above = false
missing = "skip"
sort = "file"
epsilon = 0.5
exclude = ["crates/webui/**"]
