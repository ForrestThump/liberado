# tuner.toml — TEMPLATE for liberado-heuristics-tuner. Copy to your config dir and edit.
# OPTIONAL (absent => every knob at its code default). Tweak per tuning session without
# recompiling — this file is read fresh on every `cargo run -p liberado-heuristics-tuner`.
#
# OPENROUTER_API_KEY is never read from here — it's a secret, stays in the environment
# (Decision 10). Every value below can also be set as an env var of the same name, uppercased and
# prefixed TUNER_ (e.g. TUNER_CALL_BUDGET) — an env var wins over this file for a one-off override.
# TUNER_SCORING_MODELS is comma-separated when set as an env var (e.g.
# "deepseek/deepseek-v4-flash,anthropic/claude-haiku-latest").

# scoring_models = ["deepseek/deepseek-v4-flash"]
# Plays "the real dispatcher" during scoring. List more than one to check whether a candidate
# prompt is robust across models or overfit to one. A diverse, cheap-per-provider set that's been
# used for a real run (see config/tuner.toml, not committed — Decision 10-adjacent, it's a local
# deployment file):
#   scoring_models = [
#     "deepseek/deepseek-v4-flash",         # DeepSeek
#     "google/gemini-3-flash-preview",      # Google
#     "x-ai/grok-4.3",                      # xAI
#     "meta-llama/llama-3.1-8b-instruct",   # Meta
#     "openai/gpt-5-nano",                  # OpenAI (cheapest GPT-5 variant)
#     "z-ai/glm-4.7-flash",                 # Zhipu
#     "xiaomi/mimo-v2.5",                   # Xiaomi
#   ]
# (Claude Haiku deliberately excluded from this set — it and Grok dominated cost in a napkin-math
# estimate for a 10-samples-per-scenario run despite being "cheap" tier, without adding much
# distinct signal over the other models already in the set.)
# (slugs spot-checked July 2026 — OpenRouter can rename them; openrouter.ai/models is the source
# of truth.)

# meta_model = "deepseek/deepseek-v4-flash"
# Proposes/mutates prompt text; defaults to the first scoring model if unset.

# samples_per_scenario = 1
# How many times each scenario is sampled per model. Real model APIs aren't perfectly
# deterministic run-to-run even at temperature 0 (see
# docs/roadmap/heuristics-tuning-engine-plan.md's "Real-model verification" findings) — raising
# this (e.g. to 3-5, or higher for a deliberately thorough run) makes the accuracy/safety numbers a
# meaningfully averaged signal instead of a single noisy sample. Cost multiplies directly:
# samples_per_scenario x number of scoring_models x ~19 scenarios per candidate scored, so raise
# call_budget (and consider lowering max_generations/mutations_per_candidate) to match. Example:
# 10 samples x 7 models x 19 scenarios = ~1330 calls just to score ONE candidate — the real
# config/tuner.toml scales max_generations down to 2 and mutations_per_candidate down to 1 to keep
# the whole run around ~9,500 calls instead of ~18,000+ at the code defaults.

# max_scenarios = 3
# Score against only the first N scenarios (declaration order in crates/eval/src/scenarios.rs),
# instead of all of them (~19). Unset by default (every scenario scores). Not a representative
# subset — just a cheap, deterministic slice for smoke-testing that a session's config (models,
# sample count, budget) actually works before committing to a full, expensive run.

# beam_width = 2                       # candidates kept per generation
# cold_starts_per_generation = 1       # fresh, independent restarts per generation (the local-maxima mitigation)
# mutations_per_candidate = 2          # mutations per beam member
# max_generations = 3                  # outer-loop cap
# call_budget = 350                    # total LLM calls (scoring + meta) for the whole session
