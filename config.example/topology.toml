# topology.toml — TEMPLATE. Copy to your config dir (LIBERADO_CONFIG_DIR, or the platform
# config dir's `liberado/` subfolder) and edit. All three config files are OPTIONAL; an absent
# file leaves that section at its built-in defaults.
#
# Topology is the deployment wiring: where the vault is, which provider/models are in play, and
# which MCP/hook components are enabled. Defaults live in code — set only what differs here.

# The Obsidian vault, the source of truth. REQUIRED (validation fails without it). The CLI's
# `serve <vault-path>` argument overrides this when given.
vault_path = "/home/shiloh/vault"

# Unix domain socket the daemon listens on for client attach (optional; has a default).
# daemon_socket = "/run/liberado/daemon.sock"

# Inference provider (provider-agnostic scaffolding). Must name a `providers` entry below —
# defaults to "deepseek", which (along with "openrouter") is already declared even if `providers`
# is never set here. Defaults live in code (`crates/config-loader/src/model.rs`); this file only
# needs to hold *deltas* — you don't have to redeclare deepseek/openrouter just to select one.
# provider = "deepseek"

# Declared inference backends — every one is built by the single, generic
# `liberado-provider-openai-compat` crate, which speaks any OpenAI-compatible chat-completions API.
# Adding a backend this system doesn't already ship with (OpenAI direct, Groq, Together, ...) is
# just one more entry here — no new crate, no Rust code change. Uncomment and edit for Groq, then
# set `provider = "groq"` above:
# [[providers]]
# name = "groq"
# base_url = "https://api.groq.com/openai/v1"
# default_model = "llama-3.3-70b-versatile"
# api_key_env = "GROQ_API_KEY"
# model_env = "GROQ_MODEL"          # optional — omit if this backend has no override-env convention
# extra_client_error_status = []    # e.g. [402] for a backend with its own "insufficient credits" code

# Enabled MCP servers. Each `name` here is what a policy grant's `ExecuteMcp` must reference, and
# it is ALSO the name the runtime connects to — `topology.mcps` is the single source for both the
# dispatcher catalog and the actual MCP connection. `description` (what the dispatcher routes over),
# `consequence` (our risk rating — the consequence guard gates direct action on it), and `transport`
# (how the runtime reaches the server) are all REQUIRED: declaring an MCP means rating and wiring it.
# `consequence` is one of: read_only, reversible, irreversible, external.
# `transport` is one of:
#   { kind = "stdio", command = "...", args = [...] }   # spawn a child process, speak MCP over stdio
#   { kind = "http",  url = "https://..." }              # connect to a remote MCP endpoint
#   { kind = "managed" }                                 # spawn a binary that `liberado-mcp-forge`
#                                                         # built from a git URL (see mcp-sources.toml)
#                                                         # — resolved by `name`, no path to hand-edit
[[mcps]]
name = "tasks-mcp"
description = "create, complete, and query tasks"
consequence = "reversible"        # git-tracked vault writes are undoable
transport = { kind = "stdio", command = "npx", args = ["-y", "@liberado/tasks-mcp"] }
# enabled = true

# A managed MCP: `liberado-mcp-forge sync` (with a matching entry in mcp-sources.toml) installs
# the binary; `name` here is the join key it resolves against. No `command`/`args` to keep in sync
# with wherever the binary was last built to — see mcp-sources.toml and
# crates/mcp-forge/ARCHITECTURE.md.
[[mcps]]
name = "liberado-weather-mcp"
description = "current weather and forecast for a location"
consequence = "read_only"
transport = { kind = "managed" }

# A workspace-local MCP, not managed (same reasoning as the `chat-search` entry below): it's a
# thin turbomcp binary over `liberado-memory-store`, native Rust, no external mem0 dependency.
# Build with `cargo build --bin liberado-memory-mcp` (dev) or `--release` (prod), then point
# `command` at the resulting path. Exposes `search_memory`/`add_memory` (general: user facts and
# preferences) and `search_tool_guidance`/`save_tool_guidance`/`delete_memory` (procedural:
# tool-selection guidance) — see `docs/specs/liberado-dispatch-logic-spec.md` §2. `default_zone`
# routes this MCP's own writes to the `memory` zone declared in policy.toml.
[[mcps]]
name = "liberado-memory-mcp"
description = "search/save general memory (user facts and preferences) and procedural memory (tool-selection guidance)"
consequence = "reversible"
transport = { kind = "stdio", command = "target/debug/liberado-memory-mcp", args = [] }
default_zone = "memory"

[[mcps]]
name = "liberado-pdf-mcp"
description = "PDF manipulation: merge, split, extract, convert"
consequence = "reversible"
transport = { kind = "managed" }

[[mcps]]
name = "liberado-rentcast-mcp"
description = "real-estate property and rent data lookups"
consequence = "read_only"
transport = { kind = "managed" }
# Leave `enabled = false` until RENTCAST_API_KEY is actually set. Without it this server doesn't
# cleanly fail the MCP handshake — it corrupts the stdio JSON-RPC stream, and chat connects to
# every registered MCP as ONE shared pool with a single connect-time budget. One broken server
# here can starve the healthy ones, leaving chat with zero tools, not just this one missing.
enabled = false

[[mcps]]
name = "liberado-anythingllm-mcp"
description = "ingest and query content in AnythingLLM"
consequence = "reversible"
transport = { kind = "managed" }
# Same reasoning as liberado-rentcast-mcp above — needs ANYTHINGLLM_API_KEY + a reachable
# instance before enabling.
enabled = false

[[mcps]]
name = "code-dispatch"
description = "Plan, implement, and review code changes; scaffold and build new MCP tools"
consequence = "reversible"
transport = { kind = "stdio", command = "riggers-mcp", args = ["--config", "riggers/riggers.yaml"] }

# A workspace-local MCP (not managed — mcp-forge's "managed" transport only supports cargo-
# installing from an external git repo; a crate that already lives in this workspace just points
# `command` at its own built binary). Build first with `cargo build --bin liberado-chat-search-mcp`
# (dev) or `--release` (prod), then point `command` at the resulting path. Exposes one tool,
# `search_conversations`, backed by the same search `GET /api/conversations/search` uses — see
# docs/roadmap/chat-search-plan.md.
# [[mcps]]
# name = "chat-search"
# description = "Search conversation history by keyword or regex"
# consequence = "read_only"
# transport = { kind = "stdio", command = "target/debug/liberado-chat-search-mcp", args = [] }

# An external-effect MCP (leaves the system / can't be taken back) is rated `external`, the
# highest risk — the consequence guard will gate direct action toward it. A remote server is reached
# over http instead of a spawned process:
# [[mcps]]
# name = "email-mcp"
# description = "send email on the user's behalf"
# consequence = "external"
# transport = { kind = "http", url = "https://mcp.example.com/mcp" }

# Named dispatcher/executor pools (Decision 18 checkpoint #3) — an ALWAYS-PRESENT "default" pool
# handles anything below that doesn't set `pool`, so declaring pools here is opt-in. A pool is pure
# authority segregation: it has its own capability grant (see policy.toml's `[[grants]]`, keyed by
# this same `name`) and its own MCP connections — it does NOT coordinate with other pools or share
# state with them (deliberately out of scope; see docs/ideas/a2a-protocol-idea.md's research note
# on why cross-pool/cross-agent coordination is NOT built here). Useful for giving an unattended
# trigger (a cron schedule, a webhook) a narrower authority than a human-attended one, without
# touching the "default" pool's grant at all.
# [[pools]]
# name = "unattended"
# enabled = true

# Cron schedules (Decision 18/19) — each fires on its own timer and dispatches `goal` through the
# exact same reactive pipeline a vault change does (the same dispatcher, same capability boundary,
# same guards). `cron_expr` uses the `cron` crate's 6/7-FIELD syntax — SECONDS FIRST, not standard
# 5-field cron: sec min hour day-of-month month day-of-week [year]. No catch-up/backfill on
# restart: a schedule due while the daemon was down simply doesn't fire retroactively. `pool`
# (optional) routes this schedule's dispatch through a named pool declared above instead of
# "default" — e.g. an unattended nightly job that should run with narrower authority than chat.
# [[schedules]]
# name = "nightly-summary"
# cron_expr = "0 0 21 * * * *"   # every day at 21:00:00
# goal = "Summarize today's decisions and post the summary."
# enabled = true
# pool = "unattended"

# Periodic memory consolidation — a cheap, general-purpose model reviews recent notes in
# memory/general and memory/procedural via liberado-memory-mcp's own tools (search_memory /
# add_memory / search_tool_guidance / save_tool_guidance / delete_memory) and merges duplicates or
# prunes stale entries. This is a real judgement pass, not a mechanical similarity-threshold script
# — the mechanical near-duplicate guard already runs on every add_memory/add_guidance call and
# catches the cheap case; this catches everything fuzzier that guard can't. Route it through the
# "unattended" pool (or a dedicated cheap-model pool) so it never runs with more authority than
# reading/writing the memory zone.
# [[schedules]]
# name = "consolidate-memory"
# cron_expr = "0 0 4 * * * *"   # daily at 04:00:00
# goal = "Review recent notes in memory/general and memory/procedural: merge near-duplicates, rewrite outdated ones, and remove anything superseded."
# enabled = true
# pool = "unattended"

# External webhook hooks (Decision 6/18/19) — the network-triggered counterpart to schedules
# above: reachable at `POST /api/hooks/{name}` and dispatches `goal` through the exact same
# reactive pipeline. Trivially callable from anything that can set an HTTP header — systemd
# `ExecStart=curl ...`, a CI webhook step, a monitoring alert integration, a home-automation HTTP
# action. `secret_ref` names an env var holding this hook's shared secret (never the secret itself
# — set it wherever you set other secrets); the caller sends it back as the
# `X-Liberado-Hook-Secret` header. Each hook has its own secret, so leaking one doesn't compromise
# others.
#
# Example:
#   export LIBERADO_HOOK_BACKUP_SECRET="$(openssl rand -hex 32)"
#   curl -X POST -H "X-Liberado-Hook-Secret: $LIBERADO_HOOK_BACKUP_SECRET" \
#        http://localhost:4201/api/hooks/nightly-backup
#
# Optional per-request extras (neither is required — a bare `curl -X POST` with no body just fires
# the configured goal as-is):
#   - a JSON body `{"context": "free text"}` appended to `goal` as runtime context (e.g. a
#     monitoring alert's message)
#   - an `X-Liberado-Idempotency-Key` header — a redelivery of the same key within ~10 minutes is
#     accepted but not re-dispatched, for senders that retry on failure
#
# No internet-facing rate limiting is built in — if this port is ever exposed beyond your LAN, put
# a reverse proxy in front of it. `pool` (optional) routes this hook through a named pool declared
# above, same as a schedule's `pool` — a network-triggered call is as "unattended" as a cron fire.
# [[hooks]]
# name = "nightly-backup"
# secret_ref = "LIBERADO_HOOK_BACKUP_SECRET"
# goal = "Run the nightly vault backup and report the result."
# enabled = true
# pool = "unattended"
