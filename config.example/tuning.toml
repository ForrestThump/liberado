# clarify_threshold_write = 0.7    # higher bar before an agent_writable write
# max_concurrent_subagents = 2     # in-flight subagent cap (KV-cache / homelab bound)
# detach_soft_timeout_secs = 20    # foreground Await -> Detach promotion point
# guidance_match_floor = 0.8       # procedural-memory score that short-circuits classification
# subagent_isolation = "in_process" # in_process | out_of_process
# max_concurrent_coding_subagents = 3  # parallel coding subagent worktrees (resource cap, not safety gate)


