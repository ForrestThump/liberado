# tuning.toml — TEMPLATE. Copy to your config dir and edit. OPTIONAL (absent => every knob at its
# specced default). These are benign behavior knobs; each field below shows its default, commented
# out. Uncomment and change only what you want to deviate.
#
# Durations are plain seconds (unambiguous in TOML).

[dispatch]
# small_fanout = 3                 # max tool calls in a direct dispatch before it becomes a subagent
# clarify_threshold_read = 0.5     # below this confidence on a read, downgrade to Clarify
# clarify_threshold_write = 0.7    # higher bar before an agent_writable write
# max_concurrent_subagents = 2     # in-flight subagent cap (KV-cache / homelab bound)
# detach_soft_timeout_secs = 20    # foreground Await -> Detach promotion point
# guidance_match_floor = 0.8       # procedural-memory score that short-circuits classification
# subagent_isolation = "in_process" # in_process | out_of_process
# max_concurrent_coding_subagents = 3  # parallel coding subagent worktrees (resource cap, not safety gate)


[context]
# max_goals = 5
# max_decisions = 5
# decision_recency_days = 7

[concurrency]
# window_secs = 60                 # recency window for "this audit entry explains this event"
# max_reaction_depth = 4           # cascade depth cap (shared with dispatch); halts runaway chains
# retry_max = 3                    # optimistic-write retries before escalating

# PARTIALLY IMPLEMENTED. `inbox_ignore_globs`, `inbox_path`, `capture_paths`, `ready_flag`,
# and `hold_flag` are live — the vault watcher's positive scope (F12): only notes under
# `inbox_path` (plus extra `capture_paths`), notes carrying `ready_flag`, and proposals/ are
# reacted to. Unflagged notes elsewhere are left for the scheduled sweep. `#hold-off` parks
# a note for watcher and schedule. Settle windows, `processed_path`, and the ambient sweep
# still parse and validate but nothing reads them — the loader warns if you set those.
# Kept because the design (docs/spec/inbox-spec.md) still stands; the inbox layer above it
# does not exist yet.
[capture]
# inbox_path = "inbox/"           # capture folder the watcher reacts to (no flag required)
# capture_paths = ["Inbox/Capture.md"]  # extra whitelist: pinned file, folders, or globs
# ready_flag = "#ready-now"       # this flag anywhere promotes a note to watcher ownership
# hold_flag = "#hold-off"         # this flag parks a note for watcher AND schedule
# inbox_settle_window_secs = 900   # quiescence before an actionable note is processed
# ready_now_settle_secs = 120      # shorter quiescence for #ready-now notes

[maintenance]
# git_commit_schedule = "per-batch+hourly"
# maintenance_schedule = "weekly"
# prune_requires_proposal = true   # pruning human-authored content always proposes first

[telegram_approvals]
# getupdate_timeout_secs = 25   # Telegram getUpdates long-poll length (1-50, Telegram's own cap)
# poll_retry_backoff_secs = 10  # backoff before retrying getUpdates after a network/API error
# revise_temperature = 0.0      # sampling temperature for the Revise button's LLM edit call

[coder]
# backend = "liberado-loop"     # the only backend; the name is kept for config compatibility
# trace_dir = "coder-traces"    # durable replay artifacts for PR factory, evals, and future TUI

# Where the harness reads its model prompts from.
#
# Unset means `prompts/coder/` inside the workspace the run is operating on, which for a coding
# run is the git worktree it was given — so a checkout's own prompts win. Every prompt is also
# compiled into the binary from the same file, so a container that ships no `prompts/` still runs.
#
# The point of the file is that you can edit a prompt and the next run uses it. No rebuild.
# Files: coder.md, diff-reviewer.md, session-critic.md, session-pack-coder.md, intake.md
# prompt_dir = "/etc/liberado/prompts"

# A config dir may hold only the files you want to override. `tuning.toml` on its own is enough
# to change anything under [coder] — it is read without the deployment-wide validation, so no
# topology.toml or policy.toml is required just to retune a coding run.

# How edit_file decides an anchor matches.
#
# Ported from oh-my-pi, which ships fuzzy matching on at 0.95. Exact matches always win; fuzzy
# only runs when there is no exact hit, and an ambiguous result is still refused rather than
# guessed at. Four dispatched runs here never got the anchor failure rate below 42%, and one
# failure was an anchor correct in every character except four leading spaces.
# [coder.edit]
# fuzzy_match = true
# fuzzy_threshold = 0.95

# Line-anchored edit mode. When on, `hashline_edit` is the ONLY edit tool offered — edit_file and
# apply_patch are withdrawn. Offering both gave the model a line-numbered read view and tools that
# match raw text, and it pasted one into the other in 14 of 41 calls.
#
# Off by default: measured over four runs of the same task, off had the best anchor failure rate
# (42%) and on had the worst (72%).
# [coder.hashline]
# enabled = false
# hash_length = 7

# Build cache and pre-run warm-up.
#
# `shared_target_dir` points every coding worktree at one CARGO_TARGET_DIR. A worktree starts with
# no cache, so its first compile rebuilds the whole dependency graph — 706 of this workspace's 770
# packages are registry crates, which are keyed by name/version rather than by path and so are
# reusable across worktrees. Workspace crates live at different paths and get their own artifacts;
# they coexist rather than collide.
#
# ONE RUN AT A TIME. Cargo takes an exclusive lock on a target directory. Concurrent builds do not
# corrupt each other, they queue — measured: the second prints "Blocking waiting for file lock" and
# waits out the first. With a command timeout in play, a run queued behind a cold build times out
# having done nothing. Sharing across concurrent runs needs a lock-free compiler cache (sccache),
# not this setting.
#
# `warmup` builds the workspace before the model is sent anything. It proves the baseline compiles
# — so a failure is the model's doing, not a question for a trace — and it keeps the provider's
# prompt cache warm, since a cold build between the system prompt and the first reply expires the
# cached prefix and bills those tokens twice.
# [coder.workspace]
# shared_target_dir = "C:/Users/you/.liberado/shared-target"
# warmup = true
# warmup_timeout_secs = 1800

# Post-run honesty review. Reads the run's own narration — not the diff — and reports where it
# contradicted itself, claimed a check it never ran, or found a defect in its own work and filed
# anyway. Off by default; findings are advisory and appear in the run report.
# [coder.session_critic]
# enabled = true
# Reviewer model. Unset falls back to [coder.critic], which defaults to deepseek-v4-flash.
# Reviewing is cheaper work than coding — pro is usually not worth its price here.
# [coder.session_critic.role]
# model = "deepseek-v4-flash"
# include_tool_names = true   # measured: dropping these cost 2 of 4 labelled traces
# remediation = false         # spawn a cold agent to fix findings on its own branch. See below.
#
# `remediation` is off deliberately and should stay off until the critic's precision is measured
# on more than a handful of runs. A ready-made fix is an argument for the finding that produced
# it, so a false positive stops being cheap and becomes a plausible wrong change with momentum.

# [coder.planner]
# model = "deepseek/deepseek-v4-pro"
# prompt_path = "prompts/coder/planner.md"
# temperature = 0.1
# max_turns = 8

# Names the model may call. Unset = the full pack catalog. Executor finish
# tools (submit_report, scratchpad) are not this list.
# offered_tools = ["read_file", "write_file", "edit_file", "run_command"]

# [coder.coder]
# model = "deepseek/deepseek-v4-pro"
# prompt_path = "prompts/coder/coder.md"  # omit to keep this default; a partial table is valid
# temperature = 0.1
# max_turns = 50
# reasoning = "high"

# [coder.critic]
# model = "deepseek/deepseek-v4-flash"
# prompt_path = "prompts/coder/critic.md"
# temperature = 0.1
# max_turns = 8

# --- Progress guard ----------------------------------------------------------------------------
# Stops a run that inspects forever without editing anything. Both limits count TOOL CALLS, not
# turns, and each escalates twice: a one-time nudge at the limit, then a hard stop at 2x. So the
# real ceilings are double the numbers below.
#
# Tune these per repo. How many files a model must read before it can edit anything depends on how
# far the change spans, and that is a property of the codebase, not of the guard. The shipped
# defaults were 4/3 (hard stop at 8 inspect calls), which is fine for a single-file edit and far
# too tight for anything crossing crates — a real task filed a complete implementation plan it had
# no budget left to carry out, twice, reporting "blocked from making edits by the progress guard".
#
# Raising these is cheap. Genuine repetition — the same call over and over — is caught separately
# and more precisely by the executor's argument-aware doom-loop and cycle guards, which fire on
# calls that actually repeat rather than on inspection generally.
# --- Run traces -------------------------------------------------------------------------------
#
# Every coding run can write a durable record of what the model was sent, what it said, which tools
# it was offered on each turn, and why the run ended. This is the difference between diagnosing a
# stuck run by reading a transcript and diagnosing it by re-deriving state from source.
#
# `trace_dir` is relative to the workspace unless absolute, so a run's evidence lands with the run.
# Set it to `false`-ish by removing it entirely to disable tracing.
#
# trace_dir = "coder-traces"
#
# `trace_formats` picks the serializations written. `native` is canonical and lossless: it is the
# only format with a slot for the harness's own decisions (tools offered per turn, guard strikes,
# finish reason). `openai-messages` is a flat message list — the shape Kilo Code stores as
# api_conversation_history.json and OpenHands stores as trajectories — which makes a same-task,
# same-model comparison against another harness a near-direct diff.
#
# The exporters are deliberately lossy *views* of the native record, never a replacement for it:
# a message list has nowhere to put "which tools were offered", so that data would simply vanish if
# an export were treated as storage. Because exports are derived, they can be regenerated at any
# time and nothing is locked into another project's schema.
#
# trace_formats = ["native", "openai-messages"]

# [coder.progress]
# read_only_turn_limit = 20   # inspect calls with no successful edit; nudge at 20, stop at 40
# same_tool_limit = 10        # same tool consecutively; nudge at 10, stop at 20
# validation_repeat_limit = 2 # identical validate failures before the run is called stuck
# max_attempts = 3            # attempts per task
# event_preview_max_chars = 500

# --- Completion gate (S1) --------------------------------------------------------------------
# Replaces the single critic with a REMEMBERED gatekeeper plus a quorum of cold reviewers, so
# "done" stops being the implementer's own claim. Deterministic verifiers still run first and are
# never overridable by a reviewer.
#
# Cost: enabling this makes 1 + fresh_reviewers model calls per attempt, on EVERY attempt. That is
# why it is off by default despite being a reliability guard.
#
# Fail-closed: an errored, timed-out, unparseable, or absent reviewer counts as REFUTING. A sick
# reviewer can never lower the bar, and a reviewer outage can never quietly weaken the quorum.
# [coder.gate]
# enabled = false           # default; set true to gate completion
# fresh_reviewers = 2       # cold reviewers; a STRICT majority must approve (2 of 2, 2 of 3)
# strategist_after = 3      # consecutive refusals before a strategist proposes one structural
#                           # change; 0 disables it
#
# Each reviewer role falls back to [coder.critic] above, so the gate needs no extra model config.
# Override only if you want, say, a stronger model holding the veto:
# [coder.gate.gatekeeper]
# model = "deepseek/deepseek-v4-pro"
# prompt_path = "prompts/coder/critic.md"

# [coder.progress]
# read_only_turn_limit = 4
# same_tool_limit = 3
# validation_repeat_limit = 2
# max_attempts = 3
# event_preview_max_chars = 500

# --- Hashline edit mode --------------------------------------------------------------------
# Line-anchored patches (oh-my-pi style): read_file emits [path#TAG] + LINE:content; the
# hashline_edit tool applies PUT/CUT/REM patches bound to the content-hash tag so stale
# anchors fail closed. TAG alphabet is uppercase base-36 (0-9A-Z).
#
# Default off — exact-string edit_file/apply_patch remain the default path.
# [coder.hashline]
# enabled = false
# hash_length = 4              # 4–10 characters

# Harness gates (docs/architecture/verifiers.md). Prefer a frozen GoalContract from intake /
# PR-dispatch freeze in product flows; these are static defaults for a project / eval run.
# Legacy single command still works:
# validation_command = { program = "cargo", args = ["test"] }
#
# PR-dispatch production profiles live in dispatch.yaml `verify:` (and env LIBERADO_VERIFY_PROFILE /
# VALIDATE_CMD). They freeze into GoalContract at submit so liberado-loop runs CI-in-the-loop.
#
# [[coder.verifiers]]
# type = "paths_exist"
# id = "paths"
# paths = ["src/main.rs", "Cargo.toml"]
#
# [[coder.verifiers]]
# type = "command"
# id = "cargo-check"
# program = "cargo"
# args = ["check"]
# timeout_secs = 300
# network = false

# MCP connection pooling (M1). Defaults: enabled = true, idle_ttl_secs = 300,
# max_in_flight_per_name = 4, connect_wait_secs = 60.
# Idle connections are reaped by a background tick (and on pool activity), not only on re-acquire.
# Escape hatch for flaky peers / debugging: enabled = false (connect-per-acquisition).
# [mcp_pooling]
# enabled = true
# idle_ttl_secs = 300
# max_in_flight_per_name = 4
# connect_wait_secs = 60
