# policy.toml — TEMPLATE. Copy to your config dir and edit. OPTIONAL (absent => no zones, no
# grants; the daemon runs with zero authority).
#
# This is the SECURITY SURFACE (Decision 4 / 5). Two things are declared here:
#   1. Per-zone write classes — how much agents may mutate a given area.
#   2. Capability grants — the explicit, named permissions each COMPONENT holds. A grant's
#      `component` is the join key: "main-agent" is chat's own tool surface (ChatSessions);
#      "dispatcher" is the ceiling the guard pipeline and ExecuteDirect/DispatchSubagent execution
#      check against. Each takes the union of every grant naming it, narrowed per dispatch, never
#      widened. A capability granted to one but not the other means an MCP reachable only through
#      dispatch-routed execution, never directly in chat (or vice versa) — see `code-dispatch`
#      below: self-extension is powerful enough to want dispatch's guard pipeline in front of it,
#      not a casual direct chat invocation.
# An UNLISTED zone fails safe to `proposal_only` (agents can never silently write somewhere
# undeclared). Every zone named in a grant MUST be declared below, and every `ExecuteMcp` MUST
# name an MCP in topology.toml — `liberado config check` enforces both.

# --- Zones and their write classes -----------------------------------------------------------
# write_class: agent_writable | shared | human_only | proposal_only

[[zones]]
zone = "tasks"
write_class = "agent_writable"   # agents write directly (with provenance + optimistic hash)

# liberado-memory-mcp's own notes (memory/general, memory/procedural) — reversible, git-tracked
# markdown, so direct agent writes (add_memory/save_tool_guidance/delete_memory, and the periodic
# consolidation schedule) don't need a human-approval round-trip.
[[zones]]
zone = "memory"
write_class = "agent_writable"

[[zones]]
zone = "decisions"
write_class = "agent_writable"

[[zones]]
zone = "proposals"
write_class = "agent_writable"

[[zones]]
zone = "inbox"
write_class = "shared"           # both humans and agents write; optimistic-concurrency handles conflicts

[[zones]]
zone = "finance"
write_class = "human_only"       # a named, sensitive zone: agents may read but never write

# --- Capability grants ------------------------------------------------------------------------
# Capabilities: Read / Write / ReadSummary over a zone, or ExecuteMcp by name.
# Zone form: { Vault = "<folder>" } for a vault folder, { Named = "<name>" } for an external zone.

# Face agent (chat): thin — human interface + built-in `delegate`. Specialist tools go on
# `dispatcher`. Uncomment ExecuteMcp only if you want the main agent to call those tools itself.
[[grants]]
component = "main-agent"
capabilities = [
    { Read = { Vault = "tasks" } },
    { Write = { Vault = "tasks" } },
    { Read = { Vault = "decisions" } },
    { Write = { Vault = "decisions" } },
    { ReadSummary = { Named = "finance" } },   # finance is human_only: read a summary, never the detail
    # { ExecuteMcp = "tasks-mcp" },
    # { ExecuteMcp = "liberado-memory-mcp" },
]

[[grants]]
component = "dispatcher"
capabilities = [
    { Read = { Vault = "tasks" } },
    { Write = { Vault = "tasks" } },
    { Read = { Vault = "decisions" } },
    { Write = { Vault = "decisions" } },
    { ReadSummary = { Named = "finance" } },
    { ExecuteMcp = "tasks-mcp" },
    { ExecuteMcp = "liberado-memory-mcp" },
    { ExecuteMcp = "code-dispatch" },          # dispatcher-only: self-extension goes through the
                                                # guard pipeline, never a direct chat tool call.
    # { ExecuteMcp = "chat-search" },          # search conversation history mid-reasoning
                                                # (read_only — safe for unattended dispatch). Not
                                                # granted to main-agent: this is a dispatched-work
                                                # tool, same tier as code-dispatch above; add it
                                                # there too if direct chat should also search
                                                # history.
]

# A named pool (Decision 18 checkpoint #3, declared via topology.toml's `[[pools]]`) is granted
# authority the exact same way as "main-agent"/"dispatcher" above — its pool `name` IS the grant's
# `component`. This is the whole mechanism: narrower authority for an unattended trigger needs
# nothing but a smaller capabilities list here, no separate pool-specific config surface.
# [[grants]]
# component = "unattended"
# capabilities = [
#     { Read = { Vault = "tasks" } },
#     { ExecuteMcp = "liberado-weather-mcp" },   # read_only only — no tasks-mcp write, no
#                                                  # code-dispatch: an unattended trigger gets far
#                                                  # less than "dispatcher"'s own grant above.
# ]

# Names of secrets the components need, resolved from the environment (never inlined). Each entry
# must be present as an env var at boot — `config check` reports any that are missing.
# secret_refs = ["DEEPSEEK_API_KEY"]
