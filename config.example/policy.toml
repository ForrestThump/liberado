# policy.toml — TEMPLATE. Copy to your config dir and edit. OPTIONAL (absent => no zones, no
# grants; the daemon runs with zero authority).
#
# This is the SECURITY SURFACE (Decision 4 / 5). Two things are declared here:
#   1. Per-zone write classes — how much agents may mutate a given area.
#   2. Capability grants — the explicit, named permissions each COMPONENT holds. A grant's
#      `component` is the join key: "main-agent" is chat's own tool surface (ChatSessions);
#      "dispatcher" is the ceiling the guard pipeline and ExecuteDirect/DispatchSubagent execution
#      check against. Each takes the union of every grant naming it, narrowed per dispatch, never
#      widened. A capability granted to one but not the other means an MCP reachable only through
#      dispatch-routed execution, never directly in chat (or vice versa) — see `code-dispatch`
#      below: self-extension is powerful enough to want dispatch's guard pipeline in front of it,
#      not a casual direct chat invocation.
# An UNLISTED zone fails safe to `proposal_only` (agents can never silently write somewhere
# undeclared). Every zone named in a grant MUST be declared below, and every `ExecuteMcp` MUST
# name an MCP in topology.toml — `liberado config check` enforces both.

# --- Zones and their write classes -----------------------------------------------------------
# write_class: agent_writable | shared | human_only | proposal_only

[[zones]]
zone = "tasks"
write_class = "agent_writable"   # agents write directly (with provenance + optimistic hash)

# liberado-memory-mcp's own notes (memory/general, memory/procedural) — reversible, git-tracked
# markdown, so direct agent writes (add_memory/save_tool_guidance/delete_memory, and the periodic
# consolidation schedule) don't need a human-approval round-trip.
[[zones]]
zone = "memory"
write_class = "agent_writable"

[[zones]]
zone = "decisions"
write_class = "agent_writable"

[[zones]]
zone = "proposals"
write_class = "agent_writable"

[[zones]]
zone = "inbox"
write_class = "shared"           # both humans and agents write; optimistic-concurrency handles conflicts

[[zones]]
zone = "finance"
write_class = "human_only"       # a named, sensitive zone: agents may read but never write

# --- Capability grants ------------------------------------------------------------------------
# Capabilities: Read / Write / ReadSummary over a zone, or ExecuteMcp by name.
# Zone form: { Vault = "<folder>" } for a vault folder, { Named = "<name>" } for an external zone.

# Face agent (chat): thin — human interface + built-in `delegate`. Specialist tools go on
# `dispatcher`. Uncomment ExecuteMcp only if you want the main agent to call those tools itself.
[[grants]]
component = "main-agent"
capabilities = [
    { Read = { Vault = "tasks" } },
    { Write = { Vault = "tasks" } },
    { Read = { Vault = "decisions" } },
    { Write = { Vault = "decisions" } },
    { ReadSummary = { Named = "finance" } },   # finance is human_only: read a summary, never the detail
    # { ExecuteMcp = "tasks-mcp" },
    # { ExecuteMcp = "liberado-memory-mcp" },
]

[[grants]]
component = "dispatcher"
capabilities = [
    { Read = { Vault = "tasks" } },
    { Write = { Vault = "tasks" } },
    { Read = { Vault = "decisions" } },
    { Write = { Vault = "decisions" } },
    { ReadSummary = { Named = "finance" } },
    { ExecuteMcp = "tasks-mcp" },
    { ExecuteMcp = "liberado-memory-mcp" },
    { ExecuteMcp = "code-dispatch" },          # dispatcher-only: self-extension goes through the
                                                # guard pipeline, never a direct chat tool call.
    # { ExecuteMcp = "chat-search" },          # search conversation history mid-reasoning
                                                # (read_only — safe for unattended dispatch). Not
                                                # granted to main-agent: this is a dispatched-work
                                                # tool, same tier as code-dispatch above; add it
                                                # there too if direct chat should also search
                                                # history.
]

# A named pool (Decision 18 checkpoint #3, declared via topology.toml's `[[pools]]`) is granted
# authority the exact same way as "main-agent"/"dispatcher" above — its pool `name` IS the grant's
# `component`. This is the whole mechanism: narrower authority for an unattended trigger needs
# nothing but a smaller capabilities list here, no separate pool-specific config surface.
# [[grants]]
# component = "unattended"
# capabilities = [
#     { Read = { Vault = "tasks" } },
#     { ExecuteMcp = "liberado-weather-mcp" },   # read_only only — no tasks-mcp write, no
#                                                  # code-dispatch: an unattended trigger gets far
#                                                  # less than "dispatcher"'s own grant above.
# ]

# --- Goal-session grants (session-focus S6) ---------------------------------------------------
# A goal session's authority is `capabilities_for(<component>)`, where the component is its
# `[[session_profiles]].component` (topology.toml) or — with no profile — the domain pack's own name.
#
# `AskHuman` is the capability to INTERRUPT YOU. It is what makes a session interactive: without it
# the kernel hands the pack a closed input channel and refuses inbound messages (403), so the session
# physically cannot block on a person. Grant it to hats a human attends (`/spawn`); withhold it from
# anything unattended (a cron), so an abandoned session can never wedge on a prompt nobody answers.
[[grants]]
component = "life"
capabilities = [
    { Read = { Vault = "tasks" } },
    { Write = { Vault = "tasks" } },
    "AskHuman",
]

[[grants]]
component = "coding"
capabilities = [
    { Read = { Vault = "decisions" } },
    "AskHuman",
]


# The unattended coding hat: the SAME coding pack, minus `AskHuman`. Used by the PR shepherd and
# anything else that starts a goal with no human behind it.
#
# Without this, every shepherd-started goal parked within seconds. Intake asked a clarifying question
# — twice re-litigating an instruction the goal prompt had already given — and nobody was there to
# answer, so the session sat in `awaiting_input` forever, survived daemon restarts as unresumable and
# uncancellable, and held a concurrency slot until the shepherd could start nothing at all. Four such
# orphans accumulated before anyone noticed, because a parked session looks exactly like a busy one.
#
# The pack already does the right thing when the capability is absent: it skips intake entirely and
# builds straight from the goal description. That behaviour existed and had never been reachable,
# because the `coding` grant hands `AskHuman` to attended and unattended sessions alike.
# The local coding hat: the ACP bridge (`liberado-acp`) that Paseo spawns on your own machine.
#
# It KEEPS `AskHuman` — unlike `coding-unattended`, there is a human sitting in the editor, and a
# question they can answer is the whole point of an interactive coding session.
#
# This grant exists so the bridge's authority is *stated* rather than implied by what its code
# happens to do. The bridge runs the coding pack in-process, outside the daemon, so it does not pass
# through `goals_start`'s profile resolution; without a row here its authority would be unauditable
# and impossible to tighten later without a refactor. The bridge refuses to start coding mode when
# this component resolves to nothing, which is the same fail-closed rule `goals_start` applies to a
# session that may do nothing.
[[grants]]
component = "coding-local"
capabilities = [
    { Read = { Vault = "decisions" } },
    "AskHuman",
]

[[grants]]
component = "coding-unattended"
capabilities = [
    { Read = { Vault = "decisions" } },
    # No AskHuman. An unattended session must never be able to wedge on a prompt nobody will answer.
]

# The S6 worked example: the SAME life pack under a strictly narrower hat — read-only, and no
# AskHuman, so it can neither interrupt you nor write the vault. Paired with the
# `[[session_profiles]]` entry named `research` in topology.toml.
[[grants]]
component = "research"
capabilities = [
    { Read = { Vault = "tasks" } },
]

# Names of secrets the components need, resolved from the environment (never inlined). Each entry
# must be present as an env var at boot — `config check` reports any that are missing.
# secret_refs = ["DEEPSEEK_API_KEY"]

# --- Machine-owned grants overlay (do NOT hand-edit this file for it) --------------------------
# When an agent hits a zone it isn't granted, Liberado sends a Telegram permission request with
# Deny / Once / Session / Everywhere buttons. Tapping "Everywhere" appends the grant to a SEPARATE,
# machine-owned file — `grants.overlay.toml` in the DATA dir (`$LIBERADO_DATA_DIR`, NOT this config
# dir) — which is merged ON TOP of this policy at boot (its grants/zones are APPENDED, never a
# rewrite of this hand-edited file). Base zones here always win on write-class, so the overlay can
# only ever ADD authority for a genuinely-undeclared zone — it can never re-open a `human_only` one.
# To revoke every "Everywhere" grant, just delete `grants.overlay.toml` and recreate the container.
# Agents can't write it (it's outside every vault zone); only a human button tap ever does.
