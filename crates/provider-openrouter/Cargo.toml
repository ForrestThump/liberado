[package]
name = "liberado-provider-openrouter"
version = "0.1.0"
description = "A thin OpenRouter (OpenAI-compatible) implementation of the Liberado `Provider` trait: chat completions with tool-calling and JSON mode, over reqwest. Routes to many models through one API, so a caller running lots of concurrent evaluations (e.g. the planned heuristics tuning engine) isn't rate-limited by a single upstream provider."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-provider = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
