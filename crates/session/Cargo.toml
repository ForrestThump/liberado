[package]
name = "liberado-session"
version = "0.1.0"
description = "The session kernel (D7): GoalSpec, SessionGrant, Visibility, the SessionEvent envelope, the GoalSessionHub, the DomainPackRunner trait, and the SessionRecordStore seam the converged store implements. Surfaces are clients of this contract — not loop owners."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
liberado-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ulid = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
proptest = "1"

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "kernel"
