[package]
name = "liberado-acp-bridge"
version = "0.1.0"
description = "ACP (Agent Client Protocol) bridge over stdio for Paseo integration."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "liberado-acp"
path = "src/main.rs"

[dependencies]
liberado-main-agent.workspace = true
liberado-provider.workspace = true
liberado-provider-openai-compat.workspace = true
liberado-config-loader.workspace = true
liberado-conversation-store.workspace = true
liberado-common.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
