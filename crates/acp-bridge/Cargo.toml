[package]
name = "liberado-acp-bridge"
version = "0.1.0"
description = "ACP (Agent Client Protocol) bridge over stdio for Paseo integration."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/spec/architecture/contracts.md)
#
# `root`, not `surface`: this binary composes the agent stack itself (main-agent, provider,
# coding tools, config) rather than speaking the wire contract to a running daemon.
# A surface may depend only on `client` crates, which this does not — it is an executable entry
# point in the same class as `daemon` and `server`.
role = "root"

[lib]
name = "liberado_acp_bridge"
path = "src/lib.rs"

[[bin]]
name = "liberado-acp"
path = "src/main.rs"

[dependencies]
liberado-session.workspace = true
async-trait.workspace = true
chat-client-contract = { workspace = true }
futures.workspace = true
liberado-bootstrap.workspace = true
liberado-coder-agent.workspace = true
liberado-coder-core.workspace = true
liberado-coder-sandbox.workspace = true
liberado-coder-tools.workspace = true
liberado-common.workspace = true
liberado-config.workspace = true
liberado-executor.workspace = true
liberado-main-agent.workspace = true
liberado-provider.workspace = true
liberado-provider-openai-compat.workspace = true
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
