[package]
name = "liberado-coder-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Executor ToolRuntime implementation for Liberado's Rust-native coder"

[features]
# Standalone / `cargo test -p liberado-coder-tools` keeps full tools.
# Downstream product crates (coder-agent → server → cli) pass
# `default-features = false` so gix + non-Rust grammars stay off the default
# liberado graph; liberado-coder-runner re-enables `full`.
default = ["git", "multi-lang"]
git = ["dep:gix"]
lang-python = ["dep:tree-sitter-python"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-go = ["dep:tree-sitter-go"]
multi-lang = ["lang-python", "lang-typescript", "lang-go"]
full = ["git", "multi-lang"]

[dependencies]
regex.workspace = true
tracing.workspace = true
liberado-common.workspace = true
async-trait.workspace = true
liberado-coder-core.workspace = true
liberado-coder-sandbox.workspace = true
liberado-executor.workspace = true
liberado-provider.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
gix = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "pack"
