[package]
name = "liberado-config"
version = "0.1.0"
description = "Config loading (Decision 14): resolve a config directory, read the per-section TOML files, assemble and validate a Config, plus the path-resolution helpers (mcp install dir, operational data dir, runtime-gating context) built on it. Deliberately dependency-light — no daemon/mcp/dispatcher/orchestrator — so tools that only need config/path resolution (e.g. liberado-mcp-forge) don't have to pull in the whole assembly stack."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-common = { workspace = true }
liberado-config-loader = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1"
liberado-coder-core = { workspace = true }
# Live-arrival test pulls the runtime gate and the provider stub through
# `live_turbovault_arrival_tests`. Both crate dependencies are dev-only because
# `liberado-config` is otherwise dependency-light by design (Decision 14), and only this
# arrival test pulls them in.
liberado-executor = { workspace = true }
liberado-provider = { workspace = true }
liberado-test-support = { workspace = true }
tokio = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "kernel"
