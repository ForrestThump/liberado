[package]
name = "liberado-sysmap"
version = "0.1.0"
description = "Data model for Liberado's isometric system map: scans Cargo manifests and topology.toml into a deterministic, serializable graph (crate DAG + runtime control/data paths)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-common = { workspace = true }
liberado-config-loader = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md).
# Tooling: meta tooling that inspects the workspace/config — not a build dependency of the system.
role = "tooling"
