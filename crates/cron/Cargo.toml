[package]
name = "liberado-cron"
version = "0.1.0"
description = "Cron as an EventSource (Decision 18/19): a schedule fires on its own timer and produces the same standardized Event vault-watch does, so the daemon reacts to it identically. Vault-agnostic by construction — no liberado-vault dependency — the concrete proof the core doesn't need the vault."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
liberado-common = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "kernel"

# Runtime wiring for the 2D system map (crates/sysmap). Outbound edges: `to` names
# a crate or runtime id (`vault`, `notifier:telegram`); `kind` is control|data. Declaring
# any flow replaces the tool's seed wiring for this crate, so the map grows with the code.
[[package.metadata.liberado.flows]]
to = "liberado-daemon"
kind = "data"
label = "timer event"

