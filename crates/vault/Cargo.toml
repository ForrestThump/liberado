[package]
name = "liberado-vault"
version = "0.1.0"
description = "Liberado's thin adapter over Turbovault: provenance-tagged writes (Decision 5) and consumer-side hash-join attribution for loop-breaking. The single place the upstream-dependency fallbacks (concurrency spec §8.1) are isolated."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-common = { workspace = true }
turbovault-core = { workspace = true }
turbovault-vault = { workspace = true }
turbovault-audit = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
# End-to-end capstone dep (drives a real turbovault MCP server). Optional +
# feature-gated: the turbovault host currently doesn't build against our local
# turbomcp fork (turbovault 1.6 refactored its McpHandler usage), so this test is
# opt-in until the fork is reconciled. Core self-tests do not need it.
turbovault = { workspace = true, optional = true }

[features]
# Enable the provenance end-to-end capstone test (needs the turbovault host).
e2e = ["dep:turbovault"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
turbomcp = { workspace = true }
proptest = "1"

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "store"
