[package]
name = "liberado-vault"
version = "0.1.0"
description = "Liberado's thin adapter over Turbovault: provenance-tagged writes (Decision 5) and consumer-side hash-join attribution for loop-breaking. The single place the upstream-dependency fallbacks (concurrency spec §8.1) are isolated."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-common = { workspace = true }
liberado-config = { workspace = true }
turbovault-core = { workspace = true }
turbovault-vault = { workspace = true }
turbovault-audit = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
# NOTE: the turbovault umbrella + turbomcp dev-deps were dropped in the turbovault-main integration.
# The umbrella is written against upstream turbomcp 3.1.5 and won't compile against our fork (see the
# turbomcp `[patch]` note in the root Cargo.toml). The old provenance_e2e capstone that used them
# tested MCP-write attribution via turbovault's audit metadata — a mechanism this integration
# replaces with the liberado-owned provenance ledger. Re-attributing MCP writes now requires
# liberado to record its own write-tool calls into the ledger (client-side); that follow-up will
# carry the replacement e2e test without needing the umbrella.

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "store"
