[package]
name = "liberado-heuristics-tuner"
version = "0.1.0"
description = "Automates prompt-tuning for dispatcher, executor/subagent tool loops, and Liberado coder-role system prompts via beam search; proposes diffs + rubrics for human review. Never auto-applies prompt changes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "liberado-heuristics-tuner"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
liberado-coder-agent = { workspace = true }
liberado-coder-core = { workspace = true }
liberado-common = { workspace = true }
liberado-config = { workspace = true }
liberado-dispatcher = { workspace = true }
liberado-eval = { workspace = true }
liberado-executor = { workspace = true }
liberado-orchestrator = { workspace = true }
liberado-provider = { workspace = true }
liberado-provider-openai-compat = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
