[package]
name = "liberado-daemon"
version = "0.1.0"
description = "The Liberado daemon (Decision 2, daemon-first): the long-running core that watches the vault, attributes changes (loop-breaking), and emits reactable events. v1 vertical slice."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
liberado-common = { workspace = true }
glob = { workspace = true }
liberado-config = { workspace = true }
liberado-notify = { workspace = true }
liberado-vault = { workspace = true }
liberado-dispatcher = { workspace = true }
liberado-orchestrator = { workspace = true }
liberado-session = { workspace = true }
# For `latency::with_correlation` only: the approval path executes inference and must attribute it
# to the proposal's originating correlation, or the cost journal records `"-"`.
liberado-provider = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
liberado-cron = { workspace = true }
liberado-executor = { workspace = true }
liberado-test-support = { workspace = true }
liberado-config-loader = { workspace = true }
liberado-dispatch-pack = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "root"

# Runtime wiring for the isometric system map (crates/sysmap). Outbound edges: `to` names
# a crate or runtime id (`vault`, `notifier:telegram`); `kind` is control|data. Declaring
# any flow replaces the tool's seed wiring for this crate, so the map grows with the code.
[[package.metadata.liberado.flows]]
to = "liberado-dispatcher"
kind = "control"
label = "Execute / Subagent / Clarify"
[[package.metadata.liberado.flows]]
to = "liberado-daemon"
kind = "control"
label = "suppress own write (loop-break)"

