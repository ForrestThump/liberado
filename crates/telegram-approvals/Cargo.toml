[package]
name = "liberado-telegram-approvals"
version = "0.1.0"
description = "Channel-agnostic approval/chat bot: Approve/Reject/Revise button taps become pure-code proposal frontmatter edits (Approve/Reject never touch an LLM; Revise redrafts content only). Telegram is the default MessagingChannel; Matrix/Discord/Signal plug in via the same trait."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-common = { workspace = true }
liberado-config-loader = { workspace = true }
liberado-messaging = { workspace = true }
liberado-notify = { workspace = true }
liberado-provider = { workspace = true }
liberado-vault = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
liberado-daemon = { workspace = true }
liberado-orchestrator = { workspace = true }
liberado-provider-openai-compat = { workspace = true }
liberado-test-support = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "service"
