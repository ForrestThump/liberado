[package]
name = "liberado-chat-search"
version = "0.1.0"
description = "Full-text and regex search over Liberado conversation history (the JSONL conversation store). Query parsing, per-file scanning, snippet extraction — shared by liberado-server's REST endpoint and the chat-search MCP tool so search logic exists exactly once."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-conversation-store = { workspace = true }
liberado-provider = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "store"
