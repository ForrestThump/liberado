[package]
name = "liberado-coder-core"
version = "0.1.0"
description = "Provider-agnostic contracts for Liberado's Rust-native coding backend: tasks, backend trait, sandbox specs, events, reports, and traces."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tracing.workspace = true
async-trait = { workspace = true }
chrono = { workspace = true }
fs4 = { workspace = true }
liberado-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
proptest.workspace = true

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "pack"
