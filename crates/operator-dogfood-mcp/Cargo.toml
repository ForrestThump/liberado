[package]
name = "liberado-operator-dogfood-mcp"
version = "0.1.0"
description = "Stdio MCP for an external operator agent to dogfood Liberado through the existing HTTP API: find or create an Agents-shelf session, open a chat, post an explicit human turn, continue that session, and read history."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "liberado-operator-dogfood-mcp"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
turbomcp = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
wiremock = "0.6"

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "service"
