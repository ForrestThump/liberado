[package]
name = "liberado-server"
version = "0.1.0"
description = "The Liberado daemon's API server (library): the watch loop + chat + HTTP/SSE API. Runnable via `liberado serve`."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-bootstrap = { workspace = true }
liberado-common = { workspace = true }
liberado-daemon = { workspace = true }
liberado-orchestrator = { workspace = true }
liberado-mcp = { workspace = true }
liberado-executor = { workspace = true }
liberado-main-agent = { workspace = true }
liberado-conversation-store = { workspace = true }
liberado-provider = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
thiserror = { workspace = true }
