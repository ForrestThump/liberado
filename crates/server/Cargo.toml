[package]
name = "liberado-server"
version = "0.1.0"
description = "The Liberado daemon's API server (library): the watch loop + chat + HTTP/SSE API. Runnable via `liberado serve`."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chat-client-contract = { workspace = true }
liberado-bootstrap = { workspace = true }
liberado-chat-search = { workspace = true }
liberado-common = { workspace = true }
liberado-cost = { workspace = true }
liberado-config = { workspace = true }
liberado-daemon = { workspace = true }
liberado-dispatcher = { workspace = true }
liberado-mcp = { workspace = true }
liberado-executor = { workspace = true }
liberado-main-agent = { workspace = true }
liberado-conversation-store = { workspace = true }
liberado-provider = { workspace = true }
liberado-telegram-approvals = { workspace = true }
liberado-commands = { workspace = true }
liberado-memory-store = { workspace = true }
liberado-vault = { workspace = true }
liberado-session = { workspace = true }
liberado-session-store = { workspace = true }
liberado-coder-agent = { workspace = true }
liberado-notify = { workspace = true }
liberado-messaging = { workspace = true }
turbovault-vector = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip"] }
tower = { version = "0.5", features = ["util"] }
thiserror = { workspace = true }

[dev-dependencies]
# The exact deserializer axum's `Query` extractor uses, so the query-string contract test in
# api/chat.rs exercises the real parser rather than an approximation of it.
serde_urlencoded = "0.7"
liberado-test-support = { workspace = true }
tempfile = { workspace = true }
# Pulls single frames off a streaming response body, so the SSE heartbeat test can observe one
# heartbeat instead of collecting a body that never ends.
http-body-util = "0.1"
# `start_paused` — runs the SSE heartbeat test on a virtual clock so it observes a 15s interval
# without taking 15 seconds.
tokio = { workspace = true, features = ["test-util"] }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "root"
