[package]
name = "liberado-tui"
version = "0.1.0"
description = "ratatui TUI client for Liberado — chat pane, status line, reactions feed; drives the shared HTTP/SSE API (docs/reference/api.md)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "liberado-tui"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
chrono = { workspace = true }
liberado-theme = { workspace = true }
liberado-markdown = { workspace = true }
liberado-commands = { workspace = true }
chat-client-contract = { workspace = true }
parking_lot = "0.12"
ctrlc = "3.4"

[dev-dependencies]
wiremock = "0.6"

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "surface"
