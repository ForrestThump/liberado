[package]
name = "liberado-sysmap-gui"
version = "0.1.0"
description = "Project-agnostic three-d system-map renderer: a native window with an orbit camera and egui panels, rendering any sysmap-core SystemMap."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
sysmap-core = { workspace = true }
three-d = { version = "0.19", features = ["egui-gui"] }
# Match three-d's egui version so the panel code shares one egui.
egui = "0.34"

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md).
role = "tooling"
