[package]
name = "liberado-sysmap-gui"
version = "0.1.0"
description = "Interactive isometric system map of Liberado — a native window rendering the crate dependency graph plus runtime control/data paths."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "liberado-sysmap"
path = "src/main.rs"
# The lib crate `liberado-sysmap` already documents the model; skipping the bin avoids a
# `cargo doc` output-filename collision between this bin and that lib.
doc = false

[dependencies]
liberado-sysmap = { workspace = true }
eframe = "0.33"
egui = "0.33"
serde_json = { workspace = true }
chrono = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md).
role = "tooling"
