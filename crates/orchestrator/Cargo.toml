[package]
name = "liberado-orchestrator"
version = "0.1.0"
description = "Bridges a dispatcher DispatchDecision to an execution: builds the task + write provenance, runs the executor's agent loop over a ToolRuntime, and returns a Report (or surfaces a Clarify). Decoupled from MCP connection management via the RuntimeFactory trait."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-common = { workspace = true }
liberado-notify = { workspace = true }
liberado-provider = { workspace = true }
liberado-session = { workspace = true }
liberado-executor = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
liberado-test-support = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "kernel"
