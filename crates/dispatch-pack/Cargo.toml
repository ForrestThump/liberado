[package]
name = "liberado-dispatch-pack"
version = "0.1.0"
description = "Domain pack that runs the dispatcher + orchestrator as a GoalSessionHub pack — the one-execution-engine convergence (E2)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
liberado-common = { workspace = true }
liberado-dispatcher = { workspace = true }
liberado-notify = { workspace = true }
liberado-orchestrator = { workspace = true }
liberado-provider = { workspace = true }
liberado-session = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
liberado-executor = { workspace = true }
liberado-provider = { workspace = true }
liberado-test-support = { workspace = true }
tempfile = { workspace = true }
liberado-config-loader = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "pack"
