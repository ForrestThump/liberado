[package]
name = "liberado-bootstrap"
version = "0.1.0"
description = "Composition helpers that build Liberado's provider/dispatcher/orchestrator from the process environment — the shared daemon-assembly logic for every binary, so the env wiring lives in one place."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-common = { workspace = true }
liberado-config = { workspace = true }
liberado-cron = { workspace = true }
liberado-daemon = { workspace = true }
liberado-dispatcher = { workspace = true }
liberado-dispatch-pack = { workspace = true }
liberado-notify = { workspace = true }
liberado-orchestrator = { workspace = true }
liberado-executor = { workspace = true }
liberado-mcp = { workspace = true }
liberado-provider = { workspace = true }
liberado-provider-openai-compat = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
liberado-vault = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "root"
