[package]
name = "chat-client-contract"
version = "0.1.0"
description = "Shared HTTP/SSE wire DTOs + the SseDecoder incremental parser -- the one contract every chat surface (TUI, WebUI, CLI) speaks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# wasm-clean core — only serde and serde_json needed for wire types.
# thiserror is a proc-macro with no runtime deps; it compiles to wasm32 fine.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "client"
