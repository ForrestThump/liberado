[package]
name = "liberado-executor"
version = "0.1.0"
description = "The Liberado agent execution engine: a bounded, adaptive tool loop that drives a Provider through real tool calls until it files a typed Report (delegated work) or answers in prose (conversational)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
sha2.workspace = true
chrono = { workspace = true }
liberado-common = { workspace = true }
liberado-notify = { workspace = true }
liberado-provider = { workspace = true }
liberado-scratchpad = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
# Test-only: the freezable clock for the wall-clock-budget tests.
liberado-common = { workspace = true, features = ["test-clock"] }
tokio = { workspace = true }
tempfile = { workspace = true }
proptest = "1"

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "kernel"

# Runtime wiring for the isometric system map (crates/sysmap). Outbound edges: `to` names
# a crate or runtime id (`vault`, `notifier:telegram`); `kind` is control|data. Declaring
# any flow replaces the tool's seed wiring for this crate, so the map grows with the code.
[[package.metadata.liberado.flows]]
to = "liberado-mcp"
kind = "control"
label = "invoke ToolRuntime"
[[package.metadata.liberado.flows]]
to = "liberado-provider"
kind = "data"
label = "agent-loop completion"
[[package.metadata.liberado.flows]]
to = "liberado-notify"
kind = "control"
label = "risk-gated notify"

