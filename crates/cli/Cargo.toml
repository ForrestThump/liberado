[package]
name = "liberado-cli"
version = "0.1.0"
description = "the `liberado` binary: a client + launcher — `serve` runs the daemon/API, `chat` is a streaming client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "liberado"
path = "src/main.rs"

[dependencies]
liberado-server = { workspace = true }
chat-client-contract = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "root"
