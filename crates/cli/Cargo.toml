[package]
name = "liberado-cli"
version = "0.1.0"
description = "the `liberado` binary: a client + launcher — `serve` runs the daemon/API, `chat` is a streaming client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "liberado"
path = "src/main.rs"

[dependencies]
liberado-common = { workspace = true }
liberado-config = { workspace = true }
liberado-config-loader = { workspace = true }
liberado-server = { workspace = true }
liberado-coder-core = { workspace = true }
liberado-harness-eval = { workspace = true }
chat-client-contract = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "root"

# Runtime wiring for the isometric system map (crates/sysmap). Outbound edges: `to` names
# a crate or runtime id (`vault`, `notifier:telegram`); `kind` is control|data. Declaring
# any flow replaces the tool's seed wiring for this crate, so the map grows with the code.
[[package.metadata.liberado.flows]]
to = "liberado-server"
kind = "data"
label = "HTTP/SSE"
