[package]
name = "liberado-main-agent"
version = "0.1.0"
description = "The conversational main agent: a multi-turn Conversation that carries context across turns and drives the executor's tool-calling loop. The thing a chat UI talks to."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
liberado-common = { workspace = true }
liberado-conversation-store = { workspace = true }
liberado-dispatcher = { workspace = true }
liberado-executor = { workspace = true }
liberado-mcp = { workspace = true }
liberado-provider = { workspace = true }
liberado-session = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
# Chat's tests run against the store production ACTUALLY uses. They used to run against
# `liberado-conversation-store::JsonlStore`, which nothing in production constructed — so the
# storage behaviour chat depends on went unverified. A dev-dependency, so the layer rules (which
# exempt dev-deps) stay honest: main-agent is a kernel crate and does not sit on a store.
liberado-session-store = { workspace = true }
liberado-dispatch-pack = { workspace = true }
liberado-orchestrator = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
liberado-config-loader = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "kernel"

# Runtime wiring for the 2D system map (crates/sysmap). Outbound edges: `to` names
# a crate or runtime id (`vault`, `notifier:telegram`); `kind` is control|data. Declaring
# any flow replaces the tool's seed wiring for this crate, so the map grows with the code.
[[package.metadata.liberado.flows]]
to = "liberado-dispatcher"
kind = "control"
label = "delegate"
[[package.metadata.liberado.flows]]
to = "liberado-executor"
kind = "control"
label = "streaming loop"
[[package.metadata.liberado.flows]]
to = "liberado-provider"
kind = "data"
label = "chat completion"

