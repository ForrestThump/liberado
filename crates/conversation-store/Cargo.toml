[package]
name = "liberado-conversation-store"
version = "0.1.0"
description = "The Decision-17 conversation-history store: an append-only log of message nodes (a DAG; linear chat is the degenerate case), persisted as JSONL outside the vault with time-sortable ids minted at append. The v1 JsonlStore behind the ConversationStore trait."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-provider = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
ulid = { workspace = true }
serde_json = { workspace = true }
