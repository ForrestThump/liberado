[package]
name = "sysmap-core"
version = "0.1.0"
description = "Project-agnostic system-map core: cargo-metadata scanning, profile-driven graph assembly, deterministic layout, projection, and styling. Project vocabulary and wiring come from data."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cargo_metadata = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.liberado]
# Tooling: meta tooling that inspects the workspace — not a build dependency of the system.
role = "tooling"
