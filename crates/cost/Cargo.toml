[package]
name = "liberado-cost"
version = "0.1.0"
description = "Token cost accounting over the latency journal (D1+D2): read-time pricing from [[models]] rates, conversation rollup via dispatch journals, per-role / turn growth / cache-hit reports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "liberado-cost"
path = "src/main.rs"

[dependencies]
liberado-common = { workspace = true }
liberado-config-loader = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "tooling"
