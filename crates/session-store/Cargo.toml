[package]
name = "liberado-session-store"
version = "0.1.0"
description = "The converged Session store (D7): one append-only JSONL log per session holding both message nodes (the DAG) and pack events. Two typed lenses — ConversationStore and SessionRecordStore — over one engine."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
[package.metadata.liberado]
role = "store"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
liberado-common = { workspace = true }
liberado-conversation-store = { workspace = true }
liberado-provider = { workspace = true }
liberado-session = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
futures = { workspace = true }
