[package]
name = "liberado-dispatcher"
version = "0.1.0"
description = "The Liberado dispatcher (Decision 1): the out-of-band router that classifies a goal into a DispatchDecision, then applies the deterministic downgrade-only guard pipeline (Decision 6) that engineers safety regardless of classifier error."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
liberado-common = { workspace = true }
liberado-config-loader = { workspace = true }
liberado-provider = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "kernel"

# Runtime wiring for the 2D system map (crates/sysmap). Outbound edges: `to` names
# a crate or runtime id (`vault`, `notifier:telegram`); `kind` is control|data. Declaring
# any flow replaces the tool's seed wiring for this crate, so the map grows with the code.
[[package.metadata.liberado.flows]]
to = "liberado-orchestrator"
kind = "control"
label = "decision → Task + provenance"
[[package.metadata.liberado.flows]]
to = "liberado-provider"
kind = "data"
label = "classify"

