[package]
name = "liberado-webui"
version = "0.1.0"
description = "Dioxus WASM web UI for Liberado — interfaces with the daemon via HTTP API"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Shiloh Mangus"]
repository = "https://github.com/shilohmangus/liberado"

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "hooks", "html", "signals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
pulldown-cmark = "0.13"
chat-client-contract = { workspace = true }
liberado-commands = { workspace = true }
liberado-theme = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "hooks", "html", "signals", "web", "launch"] }
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["console", "Window", "Location", "EventSource", "MessageEvent", "Document", "Element", "HtmlElement", "HtmlTextAreaElement", "CssStyleDeclaration"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
urlencoding = "2"

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
