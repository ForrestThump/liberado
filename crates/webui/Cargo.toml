[package]
name = "liberado-webui"
version = "0.1.0"
description = "Dioxus WASM web UI for Liberado — interfaces with the daemon via HTTP API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "hooks", "html", "signals"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
pulldown-cmark = "0.13"
chat-client-contract = { workspace = true }
liberado-commands = { workspace = true }
liberado-theme = { workspace = true }
# Not wasm-gated, though only the browser build issues requests: `stream_url` builds the chat URL and
# is tested on the host, which is the point of having extracted it.
urlencoding = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "hooks", "html", "signals", "web", "launch"] }
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["console", "Window", "Location", "EventSource", "MessageEvent", "Document", "Element", "HtmlElement", "HtmlTextAreaElement", "CssStyleDeclaration", "Storage", "Request", "RequestInit", "Event", "EventTarget", "History"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Only for `Reflect::set` — web-sys has no binding for `RequestInit.keepalive`, which the
# unload-time incognito discard needs. See components/incognito.rs.
js-sys = "0.3"

[dev-dependencies]
# `handle_slash_command` tests exercise the network-free command paths (`/help`, `/new`, `/clear`,
# `/theme set`). The workspace tokio already carries the heavy features; this only names the ones
# the tests use.
tokio = { workspace = true, features = ["rt", "macros"] }

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "surface"

# Runtime wiring for the isometric system map (crates/sysmap). Outbound edges: `to` names
# a crate or runtime id (`vault`, `notifier:telegram`); `kind` is control|data. Declaring
# any flow replaces the tool's seed wiring for this crate, so the map grows with the code.
[[package.metadata.liberado.flows]]
to = "liberado-server"
kind = "data"
label = "HTTP/SSE"

