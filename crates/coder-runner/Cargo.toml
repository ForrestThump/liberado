[package]
name = "liberado-coder-runner"
version = "0.1.0"
description = "Process boundary for the coding pack: the liberado-coder-run subprocess bridge nested consumers (PR factory) drive over JSON."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "liberado-coder-run"
path = "src/main.rs"

[dependencies]
liberado-coder-agent.workspace = true
liberado-coder-core.workspace = true
liberado-coder-tools.workspace = true
liberado-common.workspace = true
liberado-config-loader.workspace = true
liberado-provider.workspace = true
liberado-provider-openai-compat.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "pack"
