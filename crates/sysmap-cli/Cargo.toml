[package]
name = "liberado-sysmap-cli"
version = "0.1.0"
description = "The liberado-sysmap CLI: builds the map (Liberado profile + topology) and opens it in the three-d window or writes the JSON export."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "liberado-sysmap"
path = "src/main.rs"
# The lib crate `liberado-sysmap` already documents the model; skipping the bin avoids a
# `cargo doc` output-filename collision between this bin and that lib.
doc = false

[dependencies]
liberado-sysmap = { workspace = true }
liberado-sysmap-gui = { workspace = true }
serde_json = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md).
role = "tooling"
