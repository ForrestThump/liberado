[package]
name = "liberado-test-support"
version = "0.1.0"
description = "Shared ToolRuntime/RuntimeFactory test doubles, consolidating what used to be duplicated across liberado-orchestrator's and liberado-daemon's own test modules. Test-only: consumed exclusively as a dev-dependency. Also hosts the path-based MVL conformance oracle (`mvl-conformance`)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "mvl-conformance"
path = "src/bin/mvl_conformance.rs"

[dependencies]
async-trait = { workspace = true }
liberado-common = { workspace = true }
liberado-provider = { workspace = true }
liberado-notify = { workspace = true }
liberado-tool-runtime = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# The MVL end-to-end test drives a real Executor and judges the trace it writes; the library
# itself only reads files and stays below the kernel.
liberado-executor = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
toml = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }

[package.metadata.liberado]
# Layer role for the layer-rules test + crate-map generator (docs/architecture/contracts.md)
role = "testing"
