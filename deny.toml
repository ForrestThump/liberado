# cargo-deny configuration — RUSTSEC advisories, license compliance, duplicate deps.
# Install: `cargo install cargo-deny`
# Run:     `cargo deny check`

[advisories]
# "warn", not "deny": bisync 0.3.0 (transitive dep of gix-protocol) was yanked
# upstream with no replacement. Blocking all CI on an external maintainer's
# action is disproportionate; revisit when gix updates its dependency.
yanked = "warn"
# `paste` (RUSTSEC-2024-0436) is unmaintained with no safe upgrade, pulled in transitively
# by fastembed/tokenizers (vector search) and ratatui (TUI). Pinned at its final version;
# revisit when an upstream dependency drops it.
ignore = [
    "RUSTSEC-2024-0436",
    # `ttf-parser` is unmaintained with no safe upgrade. It is pulled in by
    # eframe's Linux window integration through winit/sctk-adwaita. Revisit
    # when that upstream GUI stack replaces it.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "NCSA",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # GUI clipboard and bundled-font assets used by eframe/egui.
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# The workspace's own crates carry their licenses in Cargo.toml; don't double-check them.
private = { ignore = true }

[bans]
multiple-versions = "warn"

# Compile-time code is a privileged dependency surface. New build scripts are
# denied unless their exact package version is reviewed and listed here.
[bans.build]
executables = "warn"
interpreted = "warn"
include-dependencies = false
include-workspace = false
