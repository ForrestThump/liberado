# Optional mdBook config for the repository docs/ tree.
#
# The searchable catalog is produced separately by:
#   liberado docs site
# That command writes index.html, search-index.json (with body text), mirrored
# pages/, and SUMMARY.md into docs-site/ (or --out). That SUMMARY.md is not this
# file's companion; mdBook uses docs/ as src, and you must supply or copy a
# SUMMARY.md into docs/ if you want `mdbook build docs`.
#
# Source of truth remains the Markdown under docs/; neither mdBook nor the
# catalog generator is a second editable wiki.

[book]
title = "Liberado"
description = "Optional mdBook view of Liberado repository documentation"
src = "."
language = "en"

[build]
build-dir = "../docs-site/mdbook"

[output.html]
site-url = "/liberado/"
git-repository-url = "https://github.com/ForrestThump/liberado"
