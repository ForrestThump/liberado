# Public Compose example for a standalone Liberado homelab service.
#
# Deploy code with `just deploy-homelab`. Set host-specific paths and secrets only in the
# host-managed Compose environment. Do not commit those values.

services:
  liberado:
    image: liberado:dev
    container_name: liberado
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "4201:4201"
    env_file:
      - .env
    environment:
      LIBERADO_PORT: "4201"
      LIBERADO_WEBUI_DIST: "/webui"
      LIBERADO_VAULT: "/vault"
      LIBERADO_SHUTDOWN_GRACE_SECS: "90"
      RUST_LOG: "info"
    volumes:
      # Keep the vault read-write. Liberado applies its policy before approved writes.
      - ${LIBERADO_VAULT_HOST_PATH:?set LIBERADO_VAULT_HOST_PATH}:/vault:rw
      - ${LIBERADO_CONFIG_HOST_PATH:?set LIBERADO_CONFIG_HOST_PATH}:/config:ro
      - ${LIBERADO_DATA_HOST_PATH:?set LIBERADO_DATA_HOST_PATH}:/data
      # The WebUI deploy updates this directory in place to preserve the bind mount inode.
      - ${LIBERADO_WEBUI_HOST_PATH:?set LIBERADO_WEBUI_HOST_PATH}:/webui:ro
    stop_grace_period: 6m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4201/api/status || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.5"

networks:
  homelab:
    external: true
