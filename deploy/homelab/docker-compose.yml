# Liberado — homelab v1 deploy (standalone compose).
#
# Deliberately a SEPARATE compose project, not an edit to the 796-line docker-compose.ai.yml: it joins
# the existing `homelab` bridge network as external, so the daemon can reach turbovault/searxng/mem0/…
# by container name once MCPs are wired, without any risk to the running stack.
#
# >>> DO NOT deploy code by hand-running `docker build` / `docker compose up`. <<<
# Use the deploy script from the repo on your dev machine — it ships an exact commit, rebuilds,
# recreates, and verifies the live SHA (see deploy/homelab/README.md):
#   bash deploy/homelab/deploy.sh
# What's live?  ->  docker exec liberado cat /etc/liberado-build-sha
#
# Build and run are decoupled (image `liberado:dev`, built from ~/liberado-build). Docker's restart
# policy is the "always running" — no systemd unit needed. Config below is a host mount: to change
# topology/policy, edit config/ + `up -d --force-recreate` (no rebuild).
#
# Secrets: put OPENROUTER_API_KEY (and optionally DEEPSEEK_API_KEY) in a gitignored
# `~/homelab/services/liberado/.env` next to this file — do NOT env_file the full
# `envs/_shared/auth.env` (that dumps every homelab key into the container).

services:
  liberado:
    image: liberado:dev
    container_name: liberado
    restart: unless-stopped
    dns:
      - 192.168.0.220   # homelab internal resolver (matches the ai-service pattern)
      - 1.1.1.1
    networks:
      - homelab
    ports:
      # LAN: http://192.168.0.144:4201 — API + SSE + the WebUI, one origin. Publicly reached at
      # https://liberado.homelab.local (Traefik on the primary node routes the host here; see
      # ~/homelab/services/traefik/dynamic/ai-node.yml).
      - "4201:4201"
    env_file:
      - .env            # OPENROUTER_API_KEY (+ optional DEEPSEEK_API_KEY) only
    environment:
      LIBERADO_PORT: "4201"
      LIBERADO_WEBUI_DIST: "/webui"   # where the bundle above is mounted
      # `liberado serve` requires the vault path via arg or this env — it does NOT fall back to
      # topology.vault_path at the CLI layer (that fallback is inside run(), reached only after the
      # CLI arg-check passes). Found on first boot, 2026-07-15.
      LIBERADO_VAULT: "/vault"
      RUST_LOG: "info"
      # OpenRouter → DeepSeek v4 Pro (slug confirmed on openrouter.ai). Overrides built-in default.
      OPENROUTER_MODEL: "deepseek/deepseek-v4-pro"
      # --- Telegram: DO NOT use TELEGRAM_BOT_TOKEN (OpenClaw owns that name). ---
      # After LIBERADO_* rename lands in the image:
      # LIBERADO_TELEGRAM_BOT_TOKEN: ...
      # LIBERADO_TELEGRAM_CHAT_ID: ...
    volumes:
      # The real Obsidian vault, syncthing-synced. Mounted READ-WRITE: v1 shipped `:ro` (the F1
      # lesson) and writes had to detour through TurboVault's own `:rw` mount; the daemon now writes
      # the vault directly, gated by policy.toml zones rather than by the mount.
      - /home/shiloh/homelab/volumes/syncthing/bulk/Obsidian/Main:/vault:rw
      # Config (topology.toml + policy.toml) and persistent data (session store), on the host.
      - /home/shiloh/homelab/services/liberado/config:/config:ro
      - /home/shiloh/homelab/services/liberado/data:/data
      # WebUI: the wasm bundle, built on the dev machine (it needs the wasm32 toolchain this
      # deploy image deliberately does not carry) and shipped separately from the binary by
      # scripts/deploy-webui-homelab.ps1. ServeDir reads it per request, so shipping a new UI is a
      # file copy - no restart, no image rebuild.
      - /home/shiloh/homelab/services/liberado/webui:/webui:ro
      # Compat mount for an image built before LIBERADO_WEBUI_DIST existed: there, DIST_DIR is a
      # path relative to the container's CWD (which is /), so this is the only place such an image
      # looks. Delete this line once an image carrying that env var is deployed.
      - /home/shiloh/homelab/services/liberado/webui:/target/dx/liberado-webui/release/web/public:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4201/api/status || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.5"

networks:
  homelab:
    external: true
