# Liberado — homelab policy (capability model + MCP grants).
#
# Face agent stays thin (delegate only). Specialists are granted to `dispatcher`
# so they reach the model only via dispatch-routed execution.

# --- Zones (write classes) ---------------------------------------------------------------------
[[zones]]
zone = "tasks"
write_class = "agent_writable"

[[zones]]
zone = "decisions"
write_class = "agent_writable"

[[zones]]
zone = "proposals"
write_class = "agent_writable"

[[zones]]
zone = "inbox"
write_class = "shared"

[[zones]]
zone = "finance"
write_class = "human_only"

# --- Capability grants -------------------------------------------------------------------------

# Face: human interfacer + built-in delegate. No ExecuteMcp — specialists stay on dispatcher.
[[grants]]
component = "main-agent"
capabilities = [
    { Read = { Vault = "tasks" } },
    { Read = { Vault = "decisions" } },
    "AskHuman",
]

# Dispatcher mesh: zone RW + every wired MCP.
[[grants]]
component = "dispatcher"
capabilities = [
    { Read = { Vault = "tasks" } },
    { Write = { Vault = "tasks" } },
    { Read = { Vault = "decisions" } },
    { Write = { Vault = "decisions" } },
    { Read = { Vault = "proposals" } },
    { Write = { Vault = "proposals" } },
    { Read = { Vault = "inbox" } },
    { Write = { Vault = "inbox" } },
    { ReadSummary = { Named = "finance" } },
    { ExecuteMcp = "turbovault" },
    { ExecuteMcp = "liberado-search-orchestrator-mcp" },
    { ExecuteMcp = "liberado-caldav-mcp" },
    { ExecuteMcp = "liberado-weather-mcp" },
    { ExecuteMcp = "liberado-pdf-mcp" },
    { ExecuteMcp = "liberado-anythingllm-mcp" },
    { ExecuteMcp = "liberado-calorie-counter-mcp" },
    { ExecuteMcp = "liberado-actual-mcp" },
    { ExecuteMcp = "liberado-spider-mcp" },
    { ExecuteMcp = "liberado-qdrant-mcp" },
    { ExecuteMcp = "deepwiki" },
]

# Life pack: vault work + vault MCP (attended).
[[grants]]
component = "life"
capabilities = [
    { Read = { Vault = "tasks" } },
    { Write = { Vault = "tasks" } },
    { Read = { Vault = "decisions" } },
    { Write = { Vault = "decisions" } },
    { Read = { Vault = "inbox" } },
    { Write = { Vault = "inbox" } },
    { ExecuteMcp = "turbovault" },
    { ExecuteMcp = "liberado-search-orchestrator-mcp" },
    { ExecuteMcp = "liberado-caldav-mcp" },
    { ExecuteMcp = "liberado-weather-mcp" },
    "AskHuman",
]

# Coding pack: narrow; no vault write, no finance tools.
[[grants]]
component = "coding"
capabilities = [
    { Read = { Vault = "decisions" } },
    { ExecuteMcp = "deepwiki" },
    { ExecuteMcp = "liberado-search-orchestrator-mcp" },
    "AskHuman",
]
