# Liberado — homelab policy (capability model + MCP grants).
#
# Face agent stays thin (delegate only). Specialists are granted to `dispatcher`
# so they reach the model only via dispatch-routed execution.

# --- Zones (write classes) ---------------------------------------------------------------------
#
# A zone is the LEADING PATH SEGMENT of a vault write, verbatim and CASE-SENSITIVE:
#   `Work/RTX/Onboarding.md` -> zone `Work`
#   `Tasks/inbox.md`         -> zone `Tasks`   (capital T — `tasks` would not match)
#
# An UNDECLARED zone is proposal-only by fail-safe, so these names must match real directories
# in the vault or every write to them is silently gated into a proposal.
#
# Corrected 2026-07-25. The previous list was `tasks` / `decisions` / `proposals` / `inbox` /
# `finance`; of those only `proposals` existed as a directory, and `tasks` differed from the real
# `Tasks` by case. The result was that essentially every real vault write failed its capability
# check and fell back to a proposal — which then also failed, because the vault was mounted `:ro`.

[[zones]]
zone = "Work"
write_class = "agent_writable"

[[zones]]
zone = "Tasks"
write_class = "agent_writable"

[[zones]]
zone = "Life"
write_class = "agent_writable"

[[zones]]
zone = "Projects"
write_class = "agent_writable"

[[zones]]
zone = "Journal"
write_class = "agent_writable"

[[zones]]
zone = "Learning"
write_class = "agent_writable"

[[zones]]
zone = "Temp"
write_class = "agent_writable"

[[zones]]
zone = "sandbox"
write_class = "agent_writable"

# Live Tier 3 conformance suite residue (artifacts + runner reports). Only the `conformance`
# grant may write here — that is the safety envelope for the suite, not polite goal text.
[[zones]]
zone = "conformance"
write_class = "agent_writable"

# The approval channel. Agents must not write here: `status` is the one proposal field outside the
# integrity signature (so a human can flip it), which made it forgeable by anything holding a write
# grant. Authority now lives in the ledger under `<LIBERADO_DATA_DIR>/`, and this closes the door
# the ledger made harmless — defence in depth, not the fix itself.
#
# Nothing legitimate loses access: the risk gate and the dispatcher write proposals through the
# filesystem directly, and the daemon and the Telegram bot use their own vault handle. None of them
# goes through a capability grant.
[[zones]]
zone = "proposals"
write_class = "human_only"

[[zones]]
zone = "wakeups"
write_class = "agent_writable"

# Records the agent must never edit unattended. Readable, but a write needs a human-approved
# proposal — these are the ones where a wrong edit is expensive or hard to notice.

[[zones]]
zone = "Legal"
write_class = "human_only"

[[zones]]
zone = "Archive"
write_class = "human_only"

[[zones]]
zone = "00 - Meta"
write_class = "human_only"

# A LOGICAL zone, not a directory: it backs `ReadSummary { Named = "finance" }` (aggregate figures
# via actual-mcp), never a vault path. Declared because a grant may not reference an undeclared
# zone — the loader fail-fasts on that, which is how this was caught.
[[zones]]
zone = "finance"
write_class = "human_only"

# Deliberately UNDECLARED, so they stay proposal-only by fail-safe: Entertainment, deliberation,
# plugins, zImages. Add a [[zones]] block if the agent should write them directly.

# --- Capability grants -------------------------------------------------------------------------

# Face: human interfacer + built-in delegate. Reads so it can answer directly; no writes — real
# work goes through `delegate` to the dispatcher. No ExecuteMcp: specialists stay on dispatcher.
[[grants]]
component = "main-agent"
capabilities = [
    { Read = { Vault = "Work" } },
    { Read = { Vault = "Tasks" } },
    { Read = { Vault = "Life" } },
    { Read = { Vault = "Projects" } },
    { Read = { Vault = "Journal" } },
    { Read = { Vault = "Learning" } },
    "AskHuman",
]

# Dispatcher mesh: zone RW + every wired MCP.
[[grants]]
component = "dispatcher"
capabilities = [
    { Read = { Vault = "Work" } },
    { Write = { Vault = "Work" } },
    { Read = { Vault = "Tasks" } },
    { Write = { Vault = "Tasks" } },
    { Read = { Vault = "Life" } },
    { Write = { Vault = "Life" } },
    { Read = { Vault = "Projects" } },
    { Write = { Vault = "Projects" } },
    { Read = { Vault = "Journal" } },
    { Write = { Vault = "Journal" } },
    { Read = { Vault = "Learning" } },
    { Write = { Vault = "Learning" } },
    { Read = { Vault = "Temp" } },
    { Write = { Vault = "Temp" } },
    { Read = { Vault = "sandbox" } },
    { Write = { Vault = "sandbox" } },
    { Read = { Vault = "proposals" } },
    { Read = { Vault = "wakeups" } },
    { Write = { Vault = "wakeups" } },
    { Read = { Vault = "Legal" } },
    { Read = { Vault = "Archive" } },
    { Read = { Vault = "00 - Meta" } },
    { ReadSummary = { Named = "finance" } },
    { ExecuteMcp = "turbovault" },
    { ExecuteMcp = "liberado-search-orchestrator-mcp" },
    { ExecuteMcp = "liberado-caldav-mcp" },
