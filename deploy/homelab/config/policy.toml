# Tier 3 conformance profile: *strictly narrower* than `dispatcher` / domain fallback so P4 can
# tell which grant was applied. Only the conformance zone + turbovault write/read for the probe note.
[[grants]]
component = "conformance"
capabilities = [
    { Read = { Vault = "conformance" } },
    { Write = { Vault = "conformance" } },
    { ExecuteMcp = "turbovault" },
]
