[[grants]]
component = "life"
capabilities = [
    { Read = { Vault = "Work" } },
    { Write = { Vault = "Work" } },
    { Read = { Vault = "Tasks" } },
    { Write = { Vault = "Tasks" } },
    { Read = { Vault = "Life" } },
