# Coding pack: narrow; no vault write, no finance tools.
[[grants]]
component = "coding"
capabilities = [
    { Read = { Vault = "Projects" } },
    { Read = { Vault = "Work" } },
    { ExecuteMcp = "deepwiki" },
    { ExecuteMcp = "liberado-python-interpreter-mcp" },
    { ExecuteMcp = "liberado-search-orchestrator-mcp" },
    "AskHuman",
