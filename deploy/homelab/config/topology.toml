# =============================================================================
# Scheduled routines (ported from OpenClaw crons, 2026-07-17).
#
# GO-LIVE 2026-07-18: all three enabled. The cron→telegram delivery build is deployed
# (daemon::maybe_deliver_cron_result), the LIBERADO_TELEGRAM_* env is set, and OpenClaw's three
# equivalent jobs were disabled via `openclaw cron disable {daily-planning,evening-debrief,
# weekly-review}` so they don't double-fire into the shared chat. Delivery was smoke-verified live.
# RELIABILITY (fixed 2026-07-18): a live verify brief returns Succeeded with real weather, a clean
# calendar result, turbovault tasks, and news — 0 wasted turns. Fixes: liberado-weather-mcp geocode
# now accepts "City, State"; liberado-caldav-mcp list_events resolves relative hrefs + accepts more
# datetime shapes. (Both MCPs build-from-URL @master.)
#
# CALENDAR OUT 2026-08-31. liberado-caldav-mcp is not currently deployed (operator directive that
# gated the AI profile off also took this out). The three brief schedules were rewritten to drop
# the calendar steps and lean on turbovault + weather + search-orchestrator. If caldav-mcp returns,
# add the calendar steps back to the goals in this file AND in services/liberado/config/topology.toml.
#
# Times are UTC (cron_expr has no timezone field). Operator wall-clock is topology.timezone
# (America/Chicago). CDT = UTC-5; CST = UTC-6 — re-check these offsets when DST flips.
#   daily  06:55 CDT = 11:55Z | evening 20:55 CDT = 01:55Z | weekly Sun 18:55 CDT = Mon 23:55Z.
# Goals can say "today" / "this evening"; the daemon prepends "Local time: … (America/Chicago)."
# when each schedule fires. Place names in goals should match where you actually live.
# Goals adapted to Liberado's tools: weather / search-orchestrator / turbovault.
# "Send to user" is gone: the daemon delivers the session summary automatically.
# =============================================================================

# =============================================================================
# Session profiles + Tier 3 conformance hook
# =============================================================================
# The live conformance suite (liberado-conformance) needs a named profile that is *narrower*
# than the domain fallback, and a hook that stamps that profile onto the reaction event.
# See docs/impl/live-conformance.md.

# Pool whose ceiling is the `conformance` policy grant (name = component). Without this, the hook
# runs on the default pool and the orchestrator intersects the session grant with `dispatcher`,
# which has no Write(conformance) — so the probe's write is stripped and becomes a permission
# request. Found on first dogfood run 2026-08-01.
[[pools]]
name = "conformance"
enabled = true

[[session_profiles]]
name = "conformance"
enabled = true
description = "Tier 3 live suite — write only under the conformance vault zone"
domain = "dispatch"
component = "conformance"
# No AskHuman — unattended probe. No delegation — stays inside the envelope.

# Built-in Automation Editor. Not an Agents-shelf profile. Empty policy grant.
# Schedule tools are face builtins. A card must not widen grants.overlay.toml.
[[session_profiles]]
name = "automation-editor"
description = "Built-in Automation Editor chat. Schedule tools only. Not on the Agents shelf."
enabled = true
delegation = false
component = "automation-editor"

[[hooks]]
name = "conformance"
enabled = true
# Env var on the box (Decision 10). Set LIBERADO_HOOK_CONFORMANCE_SECRET before boot.
secret_ref = "LIBERADO_HOOK_CONFORMANCE_SECRET"
profile = "conformance"
pool = "conformance"
goal = """
You are a live-conformance probe. Do exactly this and nothing else:

1. From the "Additional context from the trigger" line, read the run_id value
   (the token after "run_id=").
2. Using turbovault write_note, create exactly one note:
   - path: conformance/artifacts/<run_id>.md
   - body: a single line exactly: CONFORMANCE_OK <run_id>
3. Do not write any other path. Do not ask the human. Do not search the web.
4. When the write succeeds, finish with a one-line summary that repeats the path.
"""

# Mechanical jobs. No model. Reminders use LIBERADO_REMINDER_BOT_TOKEN and
# LIBERADO_REMINDER_CHAT_ID, not the sticky chat. deliver = false keeps the sticky
# notifier out of the path. See ADR-0020 and docs/spec/reference/tuning.md.
# Timed vault reminders stay off. Turn on [vault_reminders] and the tick below once
# the vault task carries #remind. A habit such as tuesday-trash can retire then.

[vault_reminders]
enabled = false
tasks = true
events = true
# Times are UTC. "Today" inside task-ping and event-ping uses topology.timezone
# (America/Chicago). 11:50 UTC = 06:50 CDT. 11:55 UTC = 06:55 CDT.
# 02:00 UTC = 21:00 CDT. 08:15 UTC = 03:15 CDT.
# When the clock is CST (UTC-6), add one hour to these UTC times.
# Tasks are Obsidian Tasks lines in vault notes. Events are Full Calendar notes,
# or a titled note under calendar/. Edit the markdown to change the next ping.

[[schedules]]
name = "morning-events"
enabled = true
cron_expr = "0 50 11 * * * *"
job = "event-ping"
deliver = false

[[schedules]]
name = "morning-tasks"
enabled = true
cron_expr = "0 55 11 * * * *"
job = "task-ping"
task_limit = 10
deliver = false

# Minute tick. Leave enabled = false until [vault_reminders] enabled = true.
# [[schedules]]
# name = "vault-reminder-tick"
# enabled = false
# cron_expr = "0 * * * * *"
# job = "vault-reminder-tick"
# deliver = false

[[schedules]]
name = "evening-journal"
enabled = true
cron_expr = "0 0 2 * * * *"
job = "habit-ping"
habit_text = "Write tonight's journal."
deliver = false

[[schedules]]
name = "vault-snapshot"
enabled = true
cron_expr = "0 15 8 * * * *"
job = "git-snapshot"
git_remote = "origin"
deliver = false

