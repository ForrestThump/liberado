writes_vault = false

# rentcast-mcp removed 2026-07-17 — operator directive: skip completely.

# Finance (Actual Budget). The Node/TS actual-mcp (which 404'd on /http) is retired; this is the
# Rust/turbomcp replacement, served on :8000.
[[mcps]]
name = "liberado-actual-mcp"
description = "Personal finance via Actual Budget: accounts, balances, transactions, spending"
consequence = "external"
transport = { kind = "http", url = "http://liberado-actual-mcp:8000" }
writes_vault = false

# Web scrape (heavier). turbomcp now; served open on the private net (the old bearer only gated the
# Firecrawl REST). Container renamed spider-mcp -> liberado-spider-mcp in the same step.
[[mcps]]
name = "liberado-spider-mcp"
description = "Web scraping and crawling: single-page scrape with extraction, and multi-page crawl"
consequence = "external"
transport = { kind = "http", url = "http://liberado-spider-mcp:8080" }
writes_vault = false

# --- Python interpreter -------------------------------------------------------
# Persistent sandboxed Python REPL: arithmetic, data wrangling, ad-hoc scripts, scratch files.
#
# `reversible`, not `external`: its state is a throwaway workspace volume, it mounts no vault and
# holds no credentials, so a bad call costs a container restart. Note that it does have network
# egress (pip needs it) — raise this to `external` if that ever stops being acceptable.
[[mcps]]
name = "liberado-python-interpreter-mcp"
description = "Run Python in a persistent REPL: calculations, data work, scratch files, pip packages"
consequence = "reversible"
transport = { kind = "http", url = "http://liberado-python-interpreter-mcp:8000" }
writes_vault = false

# --- RAG store (Qdrant) ------------------------------------------------------
# Its own corpus, embedded LOCALLY (fastembed ONNX, 384-dim) — no API key, no external service.
# NOTE: it shares the `qdrant` container with AnythingLLM, whose collections are 1024-dim and
# written by a different embedder. Those are AnythingLLM's to serve (liberado-anythingllm-mcp);
# vectors are only comparable within one model, so this MCP sticks to its own collections.
[[mcps]]
name = "liberado-qdrant-mcp"
description = "Semantic memory: ingest text/files into a vector store and search it by meaning"
consequence = "reversible"
transport = { kind = "http", url = "http://liberado-qdrant-mcp:3000" }
writes_vault = false

# Remote docs Q&A (no local container).
[[mcps]]
name = "deepwiki"
description = "Ask questions about public GitHub repository documentation"
consequence = "read_only"
transport = { kind = "http", url = "https://mcp.deepwiki.com" }

# =============================================================================
# Scheduled routines (ported from OpenClaw crons, 2026-07-17).
#
# GO-LIVE 2026-07-18: all three enabled. The cron→telegram delivery build is deployed
# (daemon::maybe_deliver_cron_result), the LIBERADO_TELEGRAM_* env is set, and OpenClaw's three
# equivalent jobs were disabled via `openclaw cron disable {daily-planning,evening-debrief,
# weekly-review}` so they don't double-fire into the shared chat. Delivery was smoke-verified live.
# RELIABILITY (fixed 2026-07-18): a live verify brief returns Succeeded with real weather, a clean
# calendar result, turbovault tasks, and news — 0 wasted turns. Fixes: liberado-weather-mcp geocode
# now accepts "City, State"; liberado-caldav-mcp list_events resolves relative hrefs + accepts more
# datetime shapes. (Both MCPs build-from-URL @master.)
#
# Times are UTC (cron_expr has no timezone field). Operator wall-clock is topology.timezone
# (America/Chicago). CDT = UTC-5; CST = UTC-6 — re-check these offsets when DST flips.
#   daily  06:55 CDT = 11:55Z | evening 20:55 CDT = 01:55Z | weekly Sun 18:55 CDT = Mon 23:55Z.
# Goals can say "today" / "this evening"; the daemon prepends "Local time: … (America/Chicago)."
# when each schedule fires. Place names in goals should match where you actually live.
# Goals adapted to Liberado's tools: caldav / weather / search-orchestrator / turbovault.
# "Send to user" is gone: the daemon delivers the session summary automatically.
# =============================================================================

[[schedules]]
name = "daily-planning"
enabled = true
cron_expr = "0 55 11 * * * *"   # 11:55 UTC = 06:55 America/Chicago CDT
goal = """
Produce a concise morning brief. Your final summary IS the brief delivered to the user, so make it the report.
1. Today's calendar events via liberado-caldav-mcp (list_calendars, then list_events for today).
2. Current weather and today's forecast via liberado-weather-mcp (use my usual home area unless I said otherwise).
3. Incomplete tasks from turbovault (filter: incomplete only) — the primary task source.
4. Three noteworthy headlines from the past 24 hours via liberado-search-orchestrator-mcp — one line each.
Deliver: today's schedule, weather snapshot, open tasks, and the 3 headlines, ending with a single focus suggestion if one stands out. Keep it tight — no filler.
"""

[[schedules]]
name = "evening-debrief"
enabled = true
cron_expr = "0 55 1 * * * *"    # 01:55 UTC = 20:55 America/Chicago CDT (previous evening)
goal = """
Produce a grounded end-of-day evening debrief. Your final summary IS the message delivered to the user.
1. Today's calendar events via liberado-caldav-mcp — what was scheduled.
2. Task status in turbovault — what's still open vs completed today.
3. Tomorrow's calendar via liberado-caldav-mcp (list_events for tomorrow).
Deliver a brief evening summary: how the day looked, open items carrying into tomorrow, and tomorrow's schedule preview. Close with one short reflection or suggested next action if something stands out. Concise, not a status report.
"""

[[schedules]]
name = "weekly-review"
enabled = true
cron_expr = "0 55 23 * * SUN *"  # 23:55 UTC Sun = 18:55 America/Chicago CDT
goal = """
Produce a weekly review. Your final summary IS the review delivered to the user.
1. Calendar for the past 7 days via liberado-caldav-mcp — what happened this week.
2. Calendar for the coming 7 days via liberado-caldav-mcp — what's ahead.
3. turbovault tasks: completed this week, still open, anything overdue.
4. A brief weekly news digest via liberado-search-orchestrator-mcp — 3–5 headlines worth knowing.
Deliver sections: **This Week** (what happened, tasks completed), **Next Week** (upcoming calendar, priorities), **Open Items** (unresolved tasks), **News Digest**, and a short **Weekly Focus** — one clear intention for the coming week. Honest and grounded, not motivational filler.
"""
