# rentcast-mcp removed 2026-07-17 — operator directive: skip completely.

# Finance (Actual Budget). The Node/TS actual-mcp (which 404'd on /http) is retired; this is the
# Rust/turbomcp replacement, served on :8000.
[[mcps]]
name = "liberado-actual-mcp"
description = "Personal finance via Actual Budget: accounts, balances, transactions, spending"
consequence = "external"
transport = { kind = "http", url = "http://liberado-actual-mcp:8000" }
writes_vault = false

# Web scrape (heavier). turbomcp now; served open on the private net (the old bearer only gated the
# Firecrawl REST). Container renamed spider-mcp -> liberado-spider-mcp in the same step.
[[mcps]]
name = "liberado-spider-mcp"
description = "Web scraping and crawling: single-page scrape with extraction, and multi-page crawl"
# read_only, not external (corrected 2026-07-25). `External` means an outbound call WITH SIDE
# EFFECTS; a scrape fetches a public page and changes nothing. Marked `external` it tripped two
# gates at once: the dispatch guard downgraded any subagent whose allowed_mcps merely CONTAINED
# it, and RiskGatedToolRuntime raised a proposal per scrape call — one read-only deep search
# produced 5 approval requests. liberado-search-orchestrator-mcp makes the same kind of outbound
# web call and is read_only; these two now agree. Crawl load/cost is a Magnitude/budget concern,
# not a Consequence one.
consequence = "read_only"
transport = { kind = "http", url = "http://liberado-spider-mcp:8080" }
writes_vault = false

# --- Python interpreter -------------------------------------------------------
# Persistent sandboxed Python REPL: arithmetic, data wrangling, ad-hoc scripts, scratch files.
#
# `reversible`, not `external`: its state is a throwaway workspace volume, it mounts no vault and
# holds no credentials, so a bad call costs a container restart. Note that it does have network
# egress (pip needs it) — raise this to `external` if that ever stops being acceptable.
[[mcps]]
name = "liberado-python-interpreter-mcp"
description = "Run Python in a persistent REPL: calculations, data work, scratch files, pip packages"
consequence = "reversible"
transport = { kind = "http", url = "http://liberado-python-interpreter-mcp:8000" }
writes_vault = false

# --- RAG store (Qdrant) ------------------------------------------------------
