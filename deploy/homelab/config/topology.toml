# Liberado — homelab topology (headless daemon, in-container).
#
# Provider: OpenRouter → DeepSeek v4 Pro. MCPs: HTTP peers on the `homelab` bridge
# (Compose already runs them; we only connect). See docs/roadmap/mcp-homelab-wire-plan.md.
#
# TOML: all root keys MUST appear before any [table] header.

vault_path = "/vault"
provider = "openrouter"
# Single source of truth for local wall-clock (Texas / US Central). Cron expressions below stay UTC;
# the daemon stamps "Local time: …" onto schedule/webhook goals from this zone.
timezone = "America/Chicago"

[main_agent]
delegation_mode = true

# --- Report delivery --------------------------------------------------------------------------
# Where a subagent's report goes when the dispatcher routes it with `delivery = Vault`.
#
# The orchestrator makes this ONE tool call itself, with no model in the loop: the research
# write-up is written verbatim and the face agent gets back only a receipt (path + size), so the
# body is never re-emitted by a second model. That is the whole point — a deep-research report used
# to be ingested by the face agent and paraphrased back out, paying for it twice and losing detail.
#
# Only a read-only dispatch can use this, and only on a clean success; anything else falls back to
# the face agent narrating the result. Both rules are enforced in the orchestrator, not here.
#
# The tool must appear in that MCP's `write_tools` below — the daemon refuses to start otherwise,
# because a "sink" that was really a read would return success and write nothing.
[report_sink]
mcp = "turbovault"
tool = "write_note"
path_arg = "path"
content_arg = "content"

# What Enter does in the browser chat composer. `newline` because this box is driven from a phone:
# Enter is the easiest key to hit there and a mis-send cannot be taken back, so nothing reachable by
# a single keypress sends. Ctrl/Cmd+Enter and the Send button do.
#
# The default is `send` (Enter sends, Shift+Enter newlines) — this line is what makes it otherwise.
# Read by the browser off `GET /api/status`, so it applies on page reload, not on daemon restart.
[webui]
enter_key = "newline"

# --- Per-role model tiering (latency knobs; edit on the box + `up -d --force-recreate`, NO rebuild) --
# Roles: main_agent (chat face), dispatcher (router), subagent (orchestrator/worker). All fields
# optional; omitted = inherit `provider` + its model. temperature (when set) overrides the per-call
# value; reasoning is "off"|"low"|"medium"|"high". Measure with deploy/homelab/latency-report.sh.
#
# ACTIVE (measured 2026-07-20): the router is a pure classifier, so a fast non-thinking model there is
# a clean win — dispatcher p50 6785ms -> ~1977ms (3.4x) with correct routing and no user-visible
# change. Face + worker stay on v4-pro (the flash face gets chattier before delegating).
[roles.dispatcher]
model = "deepseek/deepseek-v4-flash"
temperature = 0.0
reasoning = "off"

# Optional further tiering (measured: flash face ~-0.6s/call but narrates "let me delegate…"):
# [roles.main_agent]
# model = "deepseek/deepseek-v4-flash"
# reasoning = "off"

# Face/worker journal `deepseek/deepseek-v4-pro`; dispatcher journals flash. Without rates here,
# every `liberado-cost` report is unpriced. List prices go stale.
[[models]]
name = "deepseek/deepseek-v4-pro"
tool_calling = true
structured_output = true
context_window = 128000
tier = "control_plane"
input = 0.435
output = 0.87
cached_input = 0.003625

[[models]]
name = "deepseek/deepseek-v4-flash"
tool_calling = true
structured_output = true
context_window = 128000
tier = "work_plane"
input = 0.14
output = 0.28
cached_input = 0.0028

# =============================================================================
# MCPs — container DNS names on the `homelab` network.
# `url` is BASE origin only (client appends /mcp). F1: every non-read_only MCP
# declares what it writes (default_zone | zone_from_arg+write_tools | writes_vault=false).
# =============================================================================

# --- Vault (develop image via homelab rebuild-turbovault.sh) -----------------
# Speak to the nginx front (`turbovault`), not turbovault-backend (needs Origin rewrite).
[[mcps]]
name = "turbovault"
description = "Obsidian vault ops via TurboVault: notes, search, links, templates, batch edits"
consequence = "reversible"
transport = { kind = "http", url = "http://turbovault:3001" }
zone_from_arg = "path"
write_tools = [
    "write_note",
    "delete_note",
    "move_note",
    "move_file",
    "update_frontmatter",
    "create_from_template",
    "update_task",
    "delete_task",
]

# --- Search ------------------------------------------------------------------
# turbomcp: multi-provider routing + failover + AI reranking. searxng-mcp was dropped once this was
# proven in production (see docs/roadmap/mcp-suite-standardization.md).
[[mcps]]
name = "liberado-search-orchestrator-mcp"
description = "Web and news search: multi-provider routing, failover, AI reranking"
consequence = "read_only"
transport = { kind = "http", url = "http://liberado-search-orchestrator-mcp:8080" }

# --- Calendar ----------------------------------------------------------------
[[mcps]]
name = "liberado-caldav-mcp"
description = "Calendar read/write via CalDAV"
consequence = "reversible"
transport = { kind = "http", url = "http://liberado-caldav-mcp:8000" }
writes_vault = false

# Memory: mem0-mcp (liberado-tool-helper-mcp) removed 2026-07-17 — superseded by the Liberado
# delegator; do not deploy. Semantic memory is now liberado-qdrant-mcp (below).

# --- Liberado-branded utilities ----------------------------------------------
[[mcps]]
name = "liberado-weather-mcp"
description = "Current weather and forecast for a location"
consequence = "read_only"
transport = { kind = "http", url = "http://liberado-weather-mcp:8000" }

[[mcps]]
name = "liberado-pdf-mcp"
description = "PDF manipulation: merge, split, extract, convert"
consequence = "reversible"
transport = { kind = "http", url = "http://liberado-pdf-mcp:8080" }
writes_vault = false

[[mcps]]
name = "liberado-anythingllm-mcp"
description = "Ingest and query content in AnythingLLM"
consequence = "reversible"
transport = { kind = "http", url = "http://liberado-anythingllm-mcp:8080" }
writes_vault = false

[[mcps]]
name = "liberado-calorie-counter-mcp"
description = "Food logging and calorie tracking"
consequence = "reversible"
transport = { kind = "http", url = "http://liberado-calorie-counter-mcp:8080" }
writes_vault = false

# rentcast-mcp removed 2026-07-17 — operator directive: skip completely.

# Finance (Actual Budget). The Node/TS actual-mcp (which 404'd on /http) is retired; this is the
# Rust/turbomcp replacement, served on :8000.
[[mcps]]
name = "liberado-actual-mcp"
description = "Personal finance via Actual Budget: accounts, balances, transactions, spending"
consequence = "external"
transport = { kind = "http", url = "http://liberado-actual-mcp:8000" }
writes_vault = false

# Web scrape (heavier). turbomcp now; served open on the private net (the old bearer only gated the
# Firecrawl REST). Container renamed spider-mcp -> liberado-spider-mcp in the same step.
[[mcps]]
name = "liberado-spider-mcp"
description = "Web scraping and crawling: single-page scrape with extraction, and multi-page crawl"
# read_only, not external (corrected 2026-07-25). `External` means an outbound call WITH SIDE
# EFFECTS; a scrape fetches a public page and changes nothing. Marked `external` it tripped two
# gates at once: the dispatch guard downgraded any subagent whose allowed_mcps merely CONTAINED
# it, and RiskGatedToolRuntime raised a proposal per scrape call — one read-only deep search
# produced 5 approval requests. liberado-search-orchestrator-mcp makes the same kind of outbound
# web call and is read_only; these two now agree. Crawl load/cost is a Magnitude/budget concern,
# not a Consequence one.
consequence = "read_only"
transport = { kind = "http", url = "http://liberado-spider-mcp:8080" }
writes_vault = false

# --- Python interpreter -------------------------------------------------------
# Persistent sandboxed Python REPL: arithmetic, data wrangling, ad-hoc scripts, scratch files.
#
# `reversible`, not `external`: its state is a throwaway workspace volume, it mounts no vault and
# holds no credentials, so a bad call costs a container restart. Note that it does have network
# egress (pip needs it) — raise this to `external` if that ever stops being acceptable.
[[mcps]]
name = "liberado-python-interpreter-mcp"
description = "Run Python in a persistent REPL: calculations, data work, scratch files, pip packages"
consequence = "reversible"
transport = { kind = "http", url = "http://liberado-python-interpreter-mcp:8000" }
writes_vault = false

# --- RAG store (Qdrant) ------------------------------------------------------
# Its own corpus, embedded LOCALLY (fastembed ONNX, 384-dim) — no API key, no external service.
# NOTE: it shares the `qdrant` container with AnythingLLM, whose collections are 1024-dim and
# written by a different embedder. Those are AnythingLLM's to serve (liberado-anythingllm-mcp);
# vectors are only comparable within one model, so this MCP sticks to its own collections.
[[mcps]]
name = "liberado-qdrant-mcp"
description = "Semantic memory: ingest text/files into a vector store and search it by meaning"
consequence = "reversible"
transport = { kind = "http", url = "http://liberado-qdrant-mcp:3000" }
writes_vault = false

# Remote docs Q&A (no local container).
[[mcps]]
name = "deepwiki"
description = "Ask questions about public GitHub repository documentation"
consequence = "read_only"
transport = { kind = "http", url = "https://mcp.deepwiki.com" }

# =============================================================================
# Scheduled routines (ported from OpenClaw crons, 2026-07-17).
#
# GO-LIVE 2026-07-18: all three enabled. The cron→telegram delivery build is deployed
# (daemon::maybe_deliver_cron_result), the LIBERADO_TELEGRAM_* env is set, and OpenClaw's three
# equivalent jobs were disabled via `openclaw cron disable {daily-planning,evening-debrief,
# weekly-review}` so they don't double-fire into the shared chat. Delivery was smoke-verified live.
# RELIABILITY (fixed 2026-07-18): a live verify brief returns Succeeded with real weather, a clean
# calendar result, turbovault tasks, and news — 0 wasted turns. Fixes: liberado-weather-mcp geocode
# now accepts "City, State"; liberado-caldav-mcp list_events resolves relative hrefs + accepts more
# datetime shapes. (Both MCPs build-from-URL @master.)
#
# Times are UTC (cron_expr has no timezone field). Operator wall-clock is topology.timezone
# (America/Chicago). CDT = UTC-5; CST = UTC-6 — re-check these offsets when DST flips.
#   daily  06:55 CDT = 11:55Z | evening 20:55 CDT = 01:55Z | weekly Sun 18:55 CDT = Mon 23:55Z.
# Goals can say "today" / "this evening"; the daemon prepends "Local time: … (America/Chicago)."
# when each schedule fires. Place names in goals should match where you actually live.
# Goals adapted to Liberado's tools: caldav / weather / search-orchestrator / turbovault.
# "Send to user" is gone: the daemon delivers the session summary automatically.
# =============================================================================

# =============================================================================
# Session profiles + Tier 3 conformance hook
# =============================================================================
# The live conformance suite (liberado-conformance) needs a named profile that is *narrower*
# than the domain fallback, and a hook that stamps that profile onto the reaction event.
# See docs/impl/live-conformance.md.

# Pool whose ceiling is the `conformance` policy grant (name = component). Without this, the hook
# runs on the default pool and the orchestrator intersects the session grant with `dispatcher`,
# which has no Write(conformance) — so the probe's write is stripped and becomes a permission
# request. Found on first dogfood run 2026-08-01.
[[pools]]
name = "conformance"
enabled = true

[[session_profiles]]
name = "conformance"
enabled = true
description = "Tier 3 live suite — write only under the conformance vault zone"
domain = "dispatch"
component = "conformance"
# No AskHuman — unattended probe. No delegation — stays inside the envelope.

[[hooks]]
name = "conformance"
enabled = true
# Env var on the box (Decision 10). Set LIBERADO_HOOK_CONFORMANCE_SECRET before boot.
secret_ref = "LIBERADO_HOOK_CONFORMANCE_SECRET"
profile = "conformance"
pool = "conformance"
goal = """
You are a live-conformance probe. Do exactly this and nothing else:

1. From the "Additional context from the trigger" line, read the run_id value
   (the token after "run_id=").
2. Using turbovault write_note, create exactly one note:
   - path: conformance/artifacts/<run_id>.md
   - body: a single line exactly: CONFORMANCE_OK <run_id>
3. Do not write any other path. Do not ask the human. Do not search the web.
4. When the write succeeds, finish with a one-line summary that repeats the path.
"""

[[schedules]]
name = "daily-planning"
enabled = true
cron_expr = "0 55 11 * * * *"   # 11:55 UTC = 06:55 America/Chicago CDT
goal = """
Produce a concise morning brief. Your final summary IS the brief delivered to the user, so make it the report.
1. Today's calendar events via liberado-caldav-mcp (list_calendars, then list_events for today).
2. Current weather and today's forecast via liberado-weather-mcp (use my usual home area unless I said otherwise).
3. Incomplete tasks from turbovault (filter: incomplete only) — the primary task source.
4. Three noteworthy headlines from the past 24 hours via liberado-search-orchestrator-mcp — one line each.
Deliver: today's schedule, weather snapshot, open tasks, and the 3 headlines, ending with a single focus suggestion if one stands out. Keep it tight — no filler.
"""

[[schedules]]
name = "evening-debrief"
enabled = true
cron_expr = "0 55 1 * * * *"    # 01:55 UTC = 20:55 America/Chicago CDT (previous evening)
goal = """
Produce a grounded end-of-day evening debrief. Your final summary IS the message delivered to the user.
1. Today's calendar events via liberado-caldav-mcp — what was scheduled.
2. Task status in turbovault — what's still open vs completed today.
3. Tomorrow's calendar via liberado-caldav-mcp (list_events for tomorrow).
Deliver a brief evening summary: how the day looked, open items carrying into tomorrow, and tomorrow's schedule preview. Close with one short reflection or suggested next action if something stands out. Concise, not a status report.
"""

[[schedules]]
name = "weekly-review"
enabled = true
cron_expr = "0 55 23 * * SUN *"  # 23:55 UTC Sun = 18:55 America/Chicago CDT
goal = """
Produce a weekly review. Your final summary IS the review delivered to the user.
1. Calendar for the past 7 days via liberado-caldav-mcp — what happened this week.
2. Calendar for the coming 7 days via liberado-caldav-mcp — what's ahead.
3. turbovault tasks: completed this week, still open, anything overdue.
4. A brief weekly news digest via liberado-search-orchestrator-mcp — 3–5 headlines worth knowing.
Deliver sections: **This Week** (what happened, tasks completed), **Next Week** (upcoming calendar, priorities), **Open Items** (unresolved tasks), **News Digest**, and a short **Weekly Focus** — one clear intention for the coming week. Honest and grounded, not motivational filler.
"""
