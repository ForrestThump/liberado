# liberado-conformance — runner config (hand-run on the box for v1).
# Lives next to topology.toml / policy.toml. See docs/impl/live-conformance.md.
#
#   liberado-conformance --config /path/to/this/file
#
# Secrets: LIBERADO_HOOK_CONFORMANCE_SECRET must be set in the environment (same pattern as other hooks).

# Required — no production default. On the box, the daemon is local.
base_url = "http://127.0.0.1:4201"

# Whole-run wall-clock budget (seconds). Default if omitted: 1800 (30 minutes).
budget_secs = 1800

# Vault root as the daemon sees it (artifact check + report write).
vault_path = "/vault"

# Topology file for P1a schedule list (period estimation). Same dir as this file on the box.
topology_path = "/config/topology.toml"

hook_name = "conformance"
hook_secret_ref = "LIBERADO_HOOK_CONFORMANCE_SECRET"
profile_name = "conformance"

# Empty = P1a–P4. Add "p5" to include the advisory delegate path.
# paths = ["p1a", "p1b", "p2", "p3", "p4"]

# When true, P5 failures set a non-zero exit code. Default false.
# advisory_counts = false

path_timeout_secs = 600

# --- P7 restart survival (opt-in) ----------------------------------------------------------------
# P7 asserts a chat turn is honestly reported across a daemon restart: new turns are refused during
# the drain (503 `shutting_down`), and afterwards the conversation never claims `turn_running` — a
# claim about a process that no longer exists.
#
# It is the only path with a side effect on the host, so it is opt-in twice over: it is never in the
# default set (a plain run stays P1a–P4), and it does nothing unless `restart_command` is set here.
# Unset → P7 **skips with a reason**. A skip is not a pass.
#
# Run the runner from somewhere that OUTLIVES the restart. Every other path is run with
# `docker exec liberado liberado-conformance …`, and that does not work here for two reasons:
# the binary ships only inside the image (there is no copy on the host), and the container has no
# docker CLI — so an in-container run could neither perform the restart nor survive it.
#
# Two workable setups, both verified:
#   1. Host: install the binary on the box, then
#        restart_command = "cd ~/homelab/services/liberado && docker compose up -d --force-recreate"
#   2. Dev machine over the LAN (what the first live P7 pass used):
#        base_url       = "http://<box-ip>:4201"
#        restart_command = "ssh <user>@<box> ./p7-restart.sh"
#      Put the compose command in a small script on the box rather than inlining it — nested quotes
#      through `cmd /C` on Windows mangle and the hook exits 2 without restarting anything.
#
#   liberado-conformance --config <this file> --path p7
