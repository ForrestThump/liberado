# Cross-provider fallback feature wires narrow waivers for three functions whose complexity grew
# by exactly +1 — one extra branch for the fallback decision per call site. The growth is
# irreducible in the sense that the alternative (splitting the fallback logic into a separate
# helper) regressed the metrics more than the inline shape, because a new helper function
# adds to the `functions` count and its own cyclomatic, and the `?` operator on its return
# adds another branch — net wash or worse.
#
# Each waiver carries a hard ceiling and a review date; any further growth in these functions
# is not covered and must be split, not waived.


