[[waiver]]
file = "crates/config-loader/src/model/config.rs"
function = "Config::validate_providers"
ceiling = 21
reason = "Cross-provider fallback feature adds two error checks inside the per-provider loop of `validate_providers`: the self-reference guard and the undeclared-name guard. Extracting them into a helper regressed the metrics more than the inline (a new function adds to the `functions` count and its own cyclomatic, and the `?` operator on its return adds another branch), so the inline shape is the ratchet-friendly one for these two specific checks."
reviewed_on = "2026-09-21"

[[waiver]]
file = "crates/config-loader/src/model/config.rs"
function = "Config::validate_schedules"
ceiling = 21
reason = "Mechanical-jobs feature adds four per-job-kind `if`/`&&` checks inside the per-schedule loop: the job-kind allowlist (KINDS.contains), `habit-ping` requires `habit_text`, `inbox-if-present` requires `goal`. Extracting them into a helper regressed the metrics more than the inline (the helper adds a new function and its own cyclomatic, the call site uses `?` which cargo-crap counts as a branch, and the inline checks would otherwise push the per-schedule loop past 10 branches). The inline form is the ratchet-friendly shape for this validation surface, exactly as the cross-provider fallback waiver is for `validate_providers`. A waiver ceiling must be above the new-function ceiling (20), so the ceiling is 21."
reviewed_on = "2026-09-25"

